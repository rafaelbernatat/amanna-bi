<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0}</style></head><body><title>Controladoria Dreamy</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#f7f8f8; --surface:#ffffff; --soft:#eef0f1; --soft-2:#f3f5f5;
  --border:#e1e4e6; --border-2:#cfd4d8; --grid:#e6e9eb;
  --ink:#0b0b0c; --muted:#575c61; --subtle:#6b7075; --faint:#a0a5aa;
  --bar-bg:#0b0b0c; --bar-ink:#e8eaea; --bar-active-bg:#ffffff; --bar-active-ink:#0b0b0c;
  --pill-bg:#eef0f1; --pill-ink:#6b7075; --pill-active-bg:#ffffff; --pill-active-ink:#0b0b0c;
  --s1:#0f7c47; --s2:#2bb463; --s3:#0071e3; --s4:#b0790a; --ink-line:#0b0b0c;
  --pos:#0f7c47; --neg:#c4271f; --neu:#6b7075; --meta:#b0790a;
  --brand:#46eb7e; --brand-soft:#e4fbec; --brand-strong:#0f7c47;
  --on-fill:#ffffff;
  --btn-bg:#0b0b0c; --btn-ink:#ffffff;
  --focus:#0f7c47;
  --r-card:18px; --r-tile:14px; --r-chip:10px;
  --shadow-panel:0 30px 70px -28px rgba(11,11,12,.28), 0 2px 6px rgba(11,11,12,.05);
  --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter Tight","Inter",system-ui,sans-serif;
  --font-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"Roboto Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b0b0c; --surface:#16181a; --soft:#1e2124; --soft-2:#22262a;
    --border:#292d31; --border-2:#3a3f44; --grid:#2b2f33;
    --ink:#f5f6f6; --muted:#a7abaf; --subtle:#8f9499; --faint:#70757a;
    --bar-bg:#22262a; --bar-ink:#a7abaf; --bar-active-bg:#46eb7e; --bar-active-ink:#08130c;
    --pill-bg:#1e2124; --pill-ink:#8f9499; --pill-active-bg:#2e3338; --pill-active-ink:#f5f6f6;
    --s1:#2bb463; --s2:#6bfa9c; --s3:#4da3ff; --s4:#e0a92a; --ink-line:#f5f6f6;
    --pos:#37d66d; --neg:#ff6f62; --neu:#8f9499; --meta:#e0a92a;
    --brand:#46eb7e; --brand-soft:#12291c; --brand-strong:#46eb7e;
    --on-fill:#08130c;
    --btn-bg:#46eb7e; --btn-ink:#08130c;
    --focus:#46eb7e;
    --shadow-panel:0 30px 70px -28px rgba(0,0,0,.65), 0 2px 6px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0b0b0c; --surface:#16181a; --soft:#1e2124; --soft-2:#22262a;
  --border:#292d31; --border-2:#3a3f44; --grid:#2b2f33;
  --ink:#f5f6f6; --muted:#a7abaf; --subtle:#8f9499; --faint:#70757a;
  --bar-bg:#22262a; --bar-ink:#a7abaf; --bar-active-bg:#46eb7e; --bar-active-ink:#08130c;
  --pill-bg:#1e2124; --pill-ink:#8f9499; --pill-active-bg:#2e3338; --pill-active-ink:#f5f6f6;
  --s1:#2bb463; --s2:#6bfa9c; --s3:#4da3ff; --s4:#e0a92a; --ink-line:#f5f6f6;
  --pos:#37d66d; --neg:#ff6f62; --neu:#8f9499; --meta:#e0a92a;
  --brand:#46eb7e; --brand-soft:#12291c; --brand-strong:#46eb7e;
  --on-fill:#08130c;
  --btn-bg:#46eb7e; --btn-ink:#08130c;
  --focus:#46eb7e;
  --shadow-panel:0 30px 70px -28px rgba(0,0,0,.65), 0 2px 6px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);overflow:hidden;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.quadro{display:flex;height:100vh;overflow:hidden;background:var(--bg)}
.coluna{flex:1 1 auto;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.cabecalho{background:var(--bg);border-bottom:1px solid var(--border-2);padding:14px 28px;flex:none;z-index:5}
.topo{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;margin-bottom:16px}
.marca-nome{font:600 15px/1.1 var(--font-display);letter-spacing:-.01em;color:var(--ink)}
.marca-sub{font:500 8px/1.2 var(--font-mono);color:var(--faint);text-transform:uppercase;letter-spacing:.14em;margin-top:3px}
.topo-fim{display:flex;justify-content:flex-end;gap:6px}
.grupo-pilulas{display:flex;gap:2px;background:var(--bar-bg);border-radius:999px;padding:4px;max-width:100%;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.grupo-pilulas::-webkit-scrollbar{display:none}
.pilula{white-space:nowrap;padding:8px 18px;border-radius:999px;background:transparent;color:var(--bar-ink);font:500 12px/1.2 var(--font-ui);text-decoration:none;border:0;cursor:pointer;transition:background .16s cubic-bezier(.22,1,.36,1),color .16s}
.pilula[aria-current="page"]{background:var(--bar-active-bg);color:var(--bar-active-ink);font-weight:600}
.pilula:not([aria-current]):hover{color:var(--ink);background:color-mix(in srgb,var(--bar-active-bg) 16%,transparent)}
.eyebrow{font:500 9px/1.2 var(--font-mono);color:var(--faint);text-transform:uppercase;letter-spacing:.13em}
h1.titulo{margin:6px 0 0;font:600 32px/1.06 var(--font-display);letter-spacing:-.028em;color:var(--ink);text-wrap:balance}
.filtros{display:flex;align-items:flex-end;gap:9px;flex-wrap:wrap;margin:14px 0 0}
.campo{display:flex;flex-direction:column;gap:4px}
.campo>span{font:500 8px/1.2 var(--font-mono);color:var(--faint);text-transform:uppercase;letter-spacing:.1em}
.campo select{appearance:none;background:var(--surface) no-repeat right 12px center;background-image:linear-gradient(45deg,transparent 50%,var(--subtle) 50%),linear-gradient(135deg,var(--subtle) 50%,transparent 50%);background-size:5px 5px,5px 5px;background-position:calc(100% - 15px) 51%,calc(100% - 10px) 51%;background-repeat:no-repeat;border:1px solid var(--border-2);border-radius:999px;padding:7px 30px 7px 14px;font:500 11.5px/1.2 var(--font-ui);color:var(--ink);cursor:pointer;min-width:114px}
.btn-forte{border:0;background:var(--btn-bg);color:var(--btn-ink);border-radius:999px;padding:8px 20px;font:600 11.5px/1.2 var(--font-ui);cursor:pointer}
.btn-leve{border:1px solid var(--border-2);background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 18px;font:500 11.5px/1.2 var(--font-ui);cursor:pointer;text-decoration:none}
.abas{display:flex;gap:2px;margin:18px 0 0;background:var(--pill-bg);border-radius:999px;padding:4px;width:fit-content;max-width:100%;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.abas::-webkit-scrollbar{display:none}
.aba{white-space:nowrap;padding:7px 14px;border-radius:999px;background:transparent;color:var(--pill-ink);font:500 11.5px/1.2 var(--font-ui);border:0;cursor:pointer}
.aba[aria-current="page"]{background:var(--pill-active-bg);color:var(--pill-active-ink);font-weight:600}
.aba:not([aria-current]):hover{color:var(--ink)}
.conteudo{flex:1 1 auto;min-height:0;min-width:0;overflow-y:auto;overflow-x:hidden;padding:16px 28px 28px;scroll-behavior:smooth}

/* ---------- kpis ---------- */
.faixa-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(186px,1fr));gap:13px;margin-bottom:18px}
.kpi{min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:17px;padding:14px 15px 13px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.kpi-topo{display:flex;align-items:center;gap:6px}
.ponto{width:5px;height:5px;border-radius:50%;flex:none}
.kpi-rot{font:500 9.5px/1.2 var(--font-ui);color:var(--subtle);letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi-val{font:600 28px/1.02 var(--font-display);color:var(--ink);letter-spacing:-.026em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-spark{height:24px;min-width:0}
.kpi-spark svg{width:100%;height:100%;display:block}
.kpi-pe{display:flex;align-items:baseline;gap:6px;font:400 10px/1.4 var(--font-ui);color:var(--subtle);min-height:14px}
.kpi-pe>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- paineis ---------- */
.grade{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;align-items:start}
.painel{min-width:0;background:var(--surface);border:1px solid var(--border);scroll-margin:16px;border-radius:var(--r-card);padding:15px 16px 14px;display:flex;flex-direction:column;gap:10px;overflow:hidden;transition:box-shadow .3s,border-color .3s}
.painel[data-destacado="1"]{border-color:var(--brand-strong);box-shadow:0 0 0 1px var(--brand-strong),0 10px 34px -16px color-mix(in srgb,var(--brand-strong) 45%,transparent)}
.painel>header{display:flex;flex-direction:column;gap:3px}
.painel-linha{display:flex;align-items:baseline;gap:8px}
.painel h2{margin:0;font:600 14px/1.25 var(--font-display);letter-spacing:-.015em;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unidade{margin-left:auto;flex:none;font:500 8.5px/1.2 var(--font-mono);color:var(--faint);text-transform:uppercase;letter-spacing:.1em}
.caixa{min-width:0}
.formula{margin:0;font:400 9.5px/1.5 var(--font-mono);color:var(--subtle);border-top:1px solid var(--grid);padding-top:8px;overflow-wrap:anywhere}
.nota{margin:0;font:400 10px/1.45 var(--font-ui);color:var(--faint)}

/* ---------- barras horizontais ---------- */
.linhas{height:100%;display:flex;flex-direction:column;justify-content:center;gap:7px;overflow:hidden}
.linha-barra{display:grid;align-items:center;gap:9px}
.linha-rot{font:500 10.5px/1.3 var(--font-ui);color:var(--muted);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trilho{height:11px;background:var(--grid);border-radius:11px;position:relative;overflow:hidden}
.trilho-aberto{overflow:visible}
.preenche{position:absolute;left:0;top:0;bottom:0;border-radius:11px}
.marca-ref{position:absolute;top:-2px;bottom:-2px;width:2px;border-radius:2px}
.linha-val{font:600 10.5px/1.3 var(--font-mono);color:var(--ink);text-align:right;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- estatisticas ---------- */
.estats{height:100%;display:grid;gap:10px;overflow:hidden}
.estat{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px;padding:12px 14px;background:var(--soft);border:1px solid var(--border);border-radius:15px;overflow:hidden}
.estat-rot{font:500 9.5px/1.25 var(--font-ui);color:var(--subtle);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.estat-val{font:600 23px/1.05 var(--font-display);letter-spacing:-.024em;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.estat-sub{font:400 9.5px/1.4 var(--font-ui);color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- grupos ---------- */
.grupos{height:100%;display:flex;flex-direction:column;justify-content:space-evenly;gap:8px;overflow:hidden}
.grupo-rot{font:600 9px/1.2 var(--font-mono);color:var(--s2);text-transform:uppercase;letter-spacing:.1em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pilha{display:flex;height:18px;border-radius:18px;overflow:hidden;background:var(--grid);gap:2px}
.pilha>span{display:flex;align-items:center;justify-content:center;font:600 9px/1 var(--font-mono);color:var(--on-fill);overflow:hidden;white-space:nowrap}
.legenda{display:flex;flex-wrap:wrap;gap:10px;overflow:hidden}
.legenda>span{display:flex;align-items:center;gap:5px;font:400 9.5px/1.2 var(--font-ui);color:var(--muted);white-space:nowrap}
.swatch{flex:none;width:7px;height:7px;border-radius:2px}

/* ---------- funil ---------- */
.passos{height:100%;display:flex;flex-direction:column;justify-content:center;gap:4px;overflow:hidden}
.passo{display:flex;align-items:center;gap:10px}
.passo-barra{min-width:68px;height:30px;flex:none;border-radius:30px;display:flex;align-items:center;padding:0 13px;font:600 11px/1 var(--font-mono);color:var(--on-fill);overflow:hidden;white-space:nowrap}
.passo-rot{font:500 10.5px/1.2 var(--font-ui);color:var(--muted);white-space:nowrap}
.passo-nota{font:500 9.5px/1.2 var(--font-mono);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- degraus ---------- */
.degraus{height:100%;display:flex;align-items:stretch;gap:6px;overflow:hidden}
.degrau{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.degrau-val{font:600 9.5px/1.2 var(--font-mono);color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.degrau-area{flex:1 1 auto;position:relative}
.degrau-area>span{position:absolute;left:0;right:0;border-radius:3px}
.degrau-rot{font:500 8.5px/1.25 var(--font-ui);color:var(--faint);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- ciclo ---------- */
.faixas{height:100%;display:flex;flex-direction:column;justify-content:center;gap:5px;overflow:hidden}
.faixa{display:grid;align-items:center;gap:8px}
.faixa-rot{font:500 9.5px/1.3 var(--font-ui);color:var(--muted);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.faixa-trilho{position:relative;height:10px;background:var(--grid);border-radius:10px}
.faixa-trilho>span{position:absolute;top:0;bottom:0;border-radius:10px}
.faixa-val{font:600 9.5px/1.3 var(--font-mono);color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.marcos{display:flex;justify-content:space-between;gap:6px;margin-top:2px}
.marcos>span{font:500 8.5px/1.2 var(--font-mono);color:var(--faint);white-space:nowrap}

/* ---------- dispersao ---------- */
.disp{height:100%;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.disp-corpo{flex:1 1 auto;display:flex;gap:6px;min-height:0}
.disp-y{flex:none;width:46px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;font:500 9px/1.2 var(--font-mono);color:var(--faint)}
.disp-area{flex:1 1 auto;position:relative;border-left:1px solid var(--border-2);border-bottom:1px solid var(--border-2)}
.disp-ponto{position:absolute;transform:translate(-50%,50%);display:flex;flex-direction:column;align-items:center;gap:2px}
.disp-ponto>b{font:600 9px/1.2 var(--font-ui);color:var(--muted);white-space:nowrap}
.disp-bola{border-radius:999px;border:1.4px solid var(--surface)}
.disp-x{display:flex;gap:6px}
.disp-x>span:first-child{flex:none;width:46px}
.disp-x-vals{flex:1 1 auto;display:flex;justify-content:space-between;font:500 9px/1.2 var(--font-mono);color:var(--faint)}
.disp-leg{display:flex;justify-content:center;gap:14px;font:500 9.5px/1.2 var(--font-ui);color:var(--subtle);white-space:nowrap;overflow:hidden}

/* ---------- mapa ---------- */
.mapa{height:100%;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(7,minmax(0,1fr));gap:4px;max-width:330px;margin:0 auto}
.uf{position:relative;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.uf-vazia{border:1px dashed var(--border-2)}
.uf-fundo{position:absolute;left:0;right:0;top:0;bottom:0}
.uf-sigla{position:relative;font:600 9.5px/1 var(--font-mono)}
.uf-val{position:relative;font:500 8px/1.3 var(--font-mono)}

/* ---------- rosca ---------- */
.rosca{height:100%;display:flex;align-items:center;gap:12px;overflow:hidden}
.rosca svg{flex:none;width:150px;height:100%}
.rosca ul{flex:1 1 auto;margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.rosca li{display:flex;align-items:center;gap:6px;font:400 10px/1.3 var(--font-ui);color:var(--muted);overflow:hidden;white-space:nowrap}
.rosca li>span:nth-child(2){overflow:hidden;text-overflow:ellipsis}
.rosca li>b{margin-left:auto;font:600 10px/1.3 var(--font-mono);color:var(--ink);font-variant-numeric:tabular-nums}

/* ---------- graficos ---------- */
.gr{width:100%;position:relative;overflow:hidden}
.gr svg{display:block}
.gr-leg{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:2px;font:500 9.5px/1.2 var(--font-mono)}
.gr-leg>span{display:flex;align-items:center;gap:4px;white-space:nowrap}
.gr-leg i{width:8px;height:8px;border-radius:2px;display:block}

/* ---------- chat ---------- */
.chat{flex:0 0 auto;width:420px;height:100vh;padding:14px;display:flex}
.chat-cartao{flex:1 1 auto;min-height:0;min-width:0;background:var(--soft-2);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow-panel);display:flex;flex-direction:column;overflow:hidden}
.chat-cab{padding:13px 14px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--surface)}
.selo{width:27px;height:27px;border-radius:9px;background:var(--btn-bg);color:var(--btn-ink);display:flex;align-items:center;justify-content:center;font:600 10px/1 var(--font-mono);flex:none}
.chat-tit{font:600 12px/1.2 var(--font-ui);color:var(--ink)}
.chat-sub{font:400 9.5px/1.3 var(--font-ui);color:var(--faint)}
.chat-btn{border:1px solid var(--border-2);background:var(--surface);color:var(--subtle);border-radius:999px;padding:6px 10px;font:500 10px/1 var(--font-ui);cursor:pointer;flex:none}
.chat-x{width:27px;height:27px;padding:0;font:600 12px/1 var(--font-ui)}
.chat-log{position:relative;flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.chat-intro{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px 14px;font:400 11.5px/1.6 var(--font-ui);color:var(--muted)}
.bolha{align-self:flex-end;max-width:88%;background:var(--btn-bg);color:var(--btn-ink);border-radius:16px 16px 4px;padding:9px 12px;font:400 11.5px/1.5 var(--font-ui);white-space:pre-line;overflow-wrap:anywhere}
.turno{align-self:flex-start;width:100%;display:flex;flex-direction:column;gap:8px}
.resp-cartao{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.resp-txt{margin:0;font:400 12px/1.6 var(--font-ui);color:var(--ink)}
.resp-formula{margin:0;font:400 9.5px/1.5 var(--font-mono);color:var(--subtle);overflow-wrap:anywhere}
.resp-cabeca{font:600 11.5px/1.4 var(--font-ui);color:var(--ink)}
details>summary{font:500 9.5px/1.3 var(--font-mono);color:var(--subtle);text-transform:uppercase;letter-spacing:.1em;cursor:pointer}
details>p{margin:6px 0 0;font:400 10.5px/1.6 var(--font-ui);color:var(--muted)}
.rotulete{display:block;margin-bottom:4px;font:500 8.5px/1.2 var(--font-mono);color:var(--subtle);text-transform:uppercase;letter-spacing:.1em}
.atalhos{display:flex;flex-direction:column;gap:5px}
.atalho{text-align:left;border:1px solid var(--border);background:var(--surface);color:var(--brand-strong);border-radius:12px;padding:7px 11px;font:400 11px/1.4 var(--font-ui);cursor:pointer}
.atalho:hover{background:var(--brand-soft)}
.acoes{display:flex;flex-direction:column;gap:6px;background:var(--soft);border:1px solid var(--border);border-radius:14px;padding:9px 12px}
.acao-chip{background:var(--surface);border:1px solid var(--border-2);border-radius:999px;padding:4px 10px;font:500 9.5px/1.3 var(--font-ui);color:var(--muted)}
.acao-linha{display:flex;gap:6px;margin-top:2px;flex-wrap:wrap}
.acao-forte{background:var(--btn-bg);color:var(--btn-ink);border:0;border-radius:999px;padding:6px 12px;font:500 10px/1 var(--font-ui);cursor:pointer;text-decoration:none}
.acao-leve{border:1px solid var(--border-2);background:var(--surface);color:var(--brand-strong);border-radius:999px;padding:5px 12px;font:500 10px/1 var(--font-ui);cursor:pointer;text-decoration:none}
.estado{font:400 11px/1.5 var(--font-ui);color:var(--subtle)}
.chat-pe{border-top:1px solid var(--border);padding:11px 14px 13px;background:var(--soft-2)}
.guia-cab{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.guia-cab>span:first-child{font:600 8.5px/1.2 var(--font-mono);color:var(--s2);text-transform:uppercase;letter-spacing:.1em;white-space:nowrap}
.guia-cab>i{flex:1 1 auto;height:1px;background:var(--grid)}
.guias{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.guia{border:1px solid var(--border-2);background:var(--surface);color:var(--brand-strong);border-radius:999px;padding:6px 11px;font:400 10px/1.3 var(--font-ui);cursor:pointer;text-align:left}
.guia:hover{background:var(--brand-soft)}
.chat-form{display:flex;gap:7px;align-items:flex-end}
.chat-form textarea{flex:1 1 auto;min-width:0;resize:none;border:1px solid var(--border-2);background:var(--surface);border-radius:14px;padding:9px 12px;font:400 11.5px/1.5 var(--font-ui);color:var(--ink)}
.chat-enviar{border:0;background:var(--btn-bg);color:var(--btn-ink);border-radius:999px;padding:0 17px;height:40px;font:500 11px/1 var(--font-ui);cursor:pointer;flex:none}
.chat-enviar:disabled{opacity:.42;cursor:default}
.chat-pe>p{margin:7px 0 0;font:400 9px/1.4 var(--font-ui);color:var(--faint)}
.flutuante{position:fixed;right:22px;bottom:22px;z-index:60;display:flex;align-items:center;gap:10px}
.flut-pill{border:1px solid var(--border-2);background:var(--surface);color:var(--muted);border-radius:999px;padding:10px 16px;font:500 11.5px/1.2 var(--font-ui);cursor:pointer;white-space:nowrap;box-shadow:0 6px 18px color-mix(in srgb,var(--ink) 12%,transparent)}
.flut-ia{width:52px;height:52px;border-radius:999px;border:0;background:var(--btn-bg);color:var(--btn-ink);font:600 12px/1 var(--font-mono);cursor:pointer;box-shadow:0 10px 26px color-mix(in srgb,var(--ink) 24%,transparent)}
.oculto{display:none!important}

@media (max-width:1240px){
  .chat{position:fixed;right:0;top:0;z-index:70;width:min(420px,100vw)}
}
@media (max-width:1080px){
  .grade>div{grid-column:span 12!important}
}
@media (max-width:760px){
  .cabecalho{padding:12px 16px}
  .conteudo{padding:14px 16px 24px}
  .topo{grid-template-columns:1fr;gap:10px}
  .topo-fim{display:none}
  h1.titulo{font-size:26px}
  .faixa-kpis{grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:10px}
}
</style>

<div class="quadro" data-teste="quadro">
  <div class="coluna">
    <header class="cabecalho" data-teste="cabecalho">
      <div class="topo">
        <div style="min-width:0">
          <div class="marca-nome" id="marcaNome"></div>
          <div class="marca-sub" id="marcaSub"></div>
        </div>
        <nav class="grupo-pilulas" aria-label="Módulos" id="navModulos"></nav>
        <div class="topo-fim">
          <button class="btn-leve" id="btnTema" type="button" title="Alternar tema claro e escuro">Tema</button>
        </div>
      </div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 class="titulo" id="titulo"></h1>
      <form class="filtros" data-teste="barra-de-filtros" id="formFiltros"></form>
      <nav class="abas" id="navTelas"></nav>
    </header>
    <main class="conteudo" data-teste="conteudo" id="conteudo">
      <div class="faixa-kpis" data-teste="faixa-de-kpis" id="faixaKpis"></div>
      <div class="grade" data-teste="grade-de-paineis" id="gradePaineis"></div>
    </main>
  </div>

  <aside class="chat oculto" data-teste="chat" id="chat">
    <div class="chat-cartao">
      <header class="chat-cab">
        <span class="selo" aria-hidden="true">IA</span>
        <div style="flex:1 1 auto;min-width:0">
          <div class="chat-tit">Converse com os dados</div>
          <div class="chat-sub">Responde, filtra e abre o gráfico</div>
        </div>
        <button class="chat-btn" type="button" id="btnNova">Nova conversa</button>
        <button class="chat-btn chat-x" type="button" id="btnFechar" aria-label="Fechar a conversa">✕</button>
      </header>
      <div class="chat-log" role="log" aria-live="polite" id="chatLog"></div>
      <footer class="chat-pe">
        <div class="guia-cab"><span>Guia desta tela</span><i aria-hidden="true"></i></div>
        <div class="guias" id="chatGuias"></div>
        <form class="chat-form" id="chatForm">
          <textarea rows="2" id="chatCampo" aria-label="Sua pergunta" placeholder="Ex.: qual o lucro apurado do ano?"></textarea>
          <button class="chat-enviar" type="submit" id="chatEnviar" disabled>Enviar</button>
        </form>
        <p id="chatNota">Cada número da resposta é conferido contra o painel antes de aparecer. Enter envia; Shift+Enter quebra a linha.</p>
      </footer>
    </div>
  </aside>

  <div class="flutuante" id="flutuante">
    <button class="flut-pill" type="button" id="btnAbrirPill">Pergunte sobre os dados</button>
    <button class="flut-ia" type="button" id="btnAbrirIA" aria-label="Abrir a conversa com os dados">IA</button>
  </div>
</div>

function gravarHash(){
  var q = new URLSearchParams();
  META.filtros.forEach(function(f){ if(estado.filtros[f.nome]!==f.sel) q.set(f.nome, estado.filtros[f.nome]); });
  if(estado.painel) q.set('painel', estado.painel);
  var s = q.toString();
  var novo = '#'+estado.rota+(s?'?'+s:'');
  if(location.hash !== novo) history.replaceState(null,'',novo);
}
function ir(rota, painel){
  if(TELAS[rota]) estado.rota = rota;
  estado.painel = painel || null;
  gravarHash(); render();
  if(estado.painel){
    var alvo = document.querySelector('[data-painel="'+estado.painel+'"]');
    if(alvo) alvo.scrollIntoView({block:'center', behavior:'smooth'});
  } else {
    document.getElementById('conteudo').scrollTop = 0;
  }
}

/* =========================================================
   CABEÇALHO
   ========================================================= */
function renderCabecalho(){
  var tela = TELAS[estado.rota], mod = modOf(estado.rota);
  var info = META.modulos.filter(function(m){ return m.id===mod; })[0];
  document.getElementById('marcaNome').textContent = META.marca.titulo;
  document.getElementById('marcaSub').textContent = META.marca.sub;

  var nm = document.getElementById('navModulos'); nm.textContent='';
  META.modulos.forEach(function(m){
    var primeira = META.telas[m.id][0][0];
    var b = el('button','pilula', m.nome);
    b.type='button'; b.setAttribute('data-teste','modulo-'+m.id);
    if(m.id===mod) b.setAttribute('aria-current','page');
    b.addEventListener('click', function(){ ir(primeira); });
    nm.appendChild(b);
  });

  document.getElementById('eyebrow').textContent = info.nome + ' · ' + estado.filtros.ano;
  document.getElementById('titulo').textContent = tela.t;
  document.title = tela.t + ' · ' + info.nome;

  var f = document.getElementById('formFiltros'); f.textContent='';
  META.filtros.forEach(function(flt){
    var lab = el('label','campo');
    lab.appendChild(el('span',null,flt.rotulo));
    var sel = document.createElement('select');
    sel.name = flt.nome; sel.setAttribute('data-teste','filtro-'+flt.nome);
    flt.opcoes.forEach(function(o){
      var op = document.createElement('option'); op.value=o[0]; op.textContent=o[1];
      if(o[0]===estado.filtros[flt.nome]) op.selected=true;
      sel.appendChild(op);
    });
    sel.addEventListener('change', function(){ estado.filtros[flt.nome]=sel.value; });
    lab.appendChild(sel); f.appendChild(lab);
  });
  var aplicar = el('button','btn-forte','Aplicar'); aplicar.type='submit';
  var limpar = el('button','btn-leve','Limpar'); limpar.type='button';
  limpar.addEventListener('click', function(){
    META.filtros.forEach(function(flt){ estado.filtros[flt.nome]=flt.sel; });
    estado.painel=null; gravarHash(); render();
  });
  f.appendChild(aplicar); f.appendChild(limpar);
  f.onsubmit = function(e){ e.preventDefault(); gravarHash(); render(); };

  var nt = document.getElementById('navTelas'); nt.textContent='';
  META.telas[mod].forEach(function(t){
    var b = el('button','aba', t[1]); b.type='button';
    if(t[0]===estado.rota) b.setAttribute('aria-current','page');
    b.addEventListener('click', function(){ ir(t[0]); });
    nt.appendChild(b);
  });
  nt.setAttribute('aria-label', info.navLabel);
}

/* =========================================================
   KPIs
   ========================================================= */
function renderKpis(){
  var caixa = document.getElementById('faixaKpis'); caixa.textContent='';
  TELAS[estado.rota].k.forEach(function(k){
    var c = el('div','kpi');
    c.setAttribute('data-teste','cartao-de-kpi'); c.setAttribute('data-kpi',k.k);
    var topo = el('div','kpi-topo');
    var pt = el('span','ponto'); pt.style.background = cor(k.c); pt.setAttribute('aria-hidden','true');
    topo.appendChild(pt); topo.appendChild(el('span','kpi-rot',k.r));
    c.appendChild(topo);
    var vv = el('div','kpi-val',k.v);
    var n = String(k.v||'').length;
    if(n > 15) vv.style.fontSize = '19px';
    else if(n > 12) vv.style.fontSize = '22px';
    else if(n > 10) vv.style.fontSize = '25px';
    c.appendChild(vv);
    if(k.s && k.s.length>1){
      var sp = el('div','kpi-spark');
      sp.innerHTML = sparkSvg(k.s, cor(k.sc||k.c));
      c.appendChild(sp);
    }
    var pe = el('div','kpi-pe');
    pe.appendChild(el('span',null,k.f||''));
    (k.x||[]).forEach(function(x){
      var s = el('span',null,x.t); if(x.cor) s.style.color = cor(x.cor); pe.appendChild(s);
    });
    c.appendChild(pe);
    caixa.appendChild(c);
  });
}
function sparkSvg(ys, stroke){
  var n = ys.length, d = '';
  for(var i=0;i<n;i++){
    var x = (i/(n-1))*100;
    d += (i?' L':'M') + Math.round(x*100)/100 + ' ' + ys[i];
  }
  return '<svg viewBox="0 0 100 24" preserveAspectRatio="none" aria-hidden="true">'+
    '<path d="'+d+'" fill="none" style="stroke:'+stroke+'" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path></svg>';
}

/* =========================================================
   PAINÉIS
   ========================================================= */
var graficos = [];
function renderPaineis(){
  var grade = document.getElementById('gradePaineis'); grade.textContent='';
  graficos = [];
  TELAS[estado.rota].p.forEach(function(p){
    var wrap = el('div'); wrap.style.gridColumn = p.sp || 'span 12'; wrap.style.minWidth='0';
    var sec = el('section','painel');
    sec.setAttribute('data-teste','painel'); sec.setAttribute('data-painel',p.k);
    sec.setAttribute('data-destacado', estado.painel===p.k ? '1':'0');
    sec.setAttribute('aria-label', p.t);
    var head = el('header');
    var linha = el('div','painel-linha');
    linha.appendChild(el('h2',null,p.t));
    if(p.u) linha.appendChild(el('span','unidade',p.u));
    head.appendChild(linha); sec.appendChild(head);

    var caixa = el('div','caixa');
    if(p.h){ caixa.style.height = p.h+'px'; caixa.style.minHeight = p.h+'px'; }
    corpo(caixa, p);
    sec.appendChild(caixa);
    if(p.n) sec.appendChild(el('p','nota',p.n));
    if(p.f){ var fm = el('p','formula',p.f); fm.setAttribute('data-teste','formula-do-painel'); sec.appendChild(fm); }
    wrap.appendChild(sec); grade.appendChild(wrap);
  });
  medirGraficos();
}

function corpo(caixa, p){
  var d = p.d;
  switch(p.y){
    case 'gBarras': case 'gBarrasEmpilhadas': case 'gLinha': {
      var box = el('div','gr'); box.style.height = p.h+'px';
      box.setAttribute('role','img'); box.setAttribute('aria-label', p.t + '. ' + (p.f||''));
      caixa.appendChild(box);
      graficos.push({box:box, tipo:p.y, d:d, h:p.h});
      break;
    }
    case 'barra': return barras(caixa, d);
    case 'estatistica': return estats(caixa, d);
    case 'grupo': return grupos(caixa, d);
    case 'passo': return passos(caixa, d);
    case 'degrau': return degraus(caixa, d);
    case 'faixa': return faixas(caixa, d);
    case 'ponto': return dispersao(caixa, d);
    case 'uf': return mapa(caixa, d);
    case 'rosca': return rosca(caixa, d);
  }
}

/* ----- barras horizontais com rótulo e valor ----- */
function barras(caixa, d){
  var box = el('div','linhas');
  d.linhas.forEach(function(l, i){
    var r = el('div','linha-barra');
    r.setAttribute('data-barra', l.rotulo);
    r.style.gridTemplateColumns = d.colunas || '96px minmax(0, 1fr) 62px';
    r.appendChild(el('div','linha-rot', l.rotulo));
    var trilho = el('div','trilho');
    var m = (d.marcas||[])[i];
    if(m){ trilho.className='trilho trilho-aberto'; }
    var pre = el('div','preenche');
    pre.style.width = (l.pct||0)+'%'; pre.style.background = cor(l.cor);
    trilho.appendChild(pre);
    if(m && m.left){
      var mk = el('span','marca-ref'); mk.style.left = m.left; mk.style.background = cor(m.cor);
      mk.title = 'referência'; trilho.appendChild(mk);
    }
    r.appendChild(trilho);
    r.appendChild(el('div','linha-val', l.valor));
    box.appendChild(r);
  });
  caixa.appendChild(box);
}

/* ----- tiles de estatística ----- */
function estats(caixa, d){
  var box = el('div','estats');
  box.style.gridTemplateColumns = d.colunas || 'repeat(2, minmax(0, 1fr))';
  d.itens.forEach(function(it){
    var t = el('div','estat'); t.setAttribute('data-estatistica', it.rotulo);
    if(it.borda){
      var c = it.borda.split(' ').pop();
      t.style.borderLeft = '3px solid ' + cor(c);
    }
    t.appendChild(el('div','estat-rot', it.rotulo));
    var v = el('div','estat-val', it.valor); v.style.color = cor(it.cor); t.appendChild(v);
    if(it.sub) t.appendChild(el('div','estat-sub', it.sub));
    box.appendChild(t);
  });
  caixa.appendChild(box);
}

/* ----- grupos empilhados 100% ----- */
function grupos(caixa, d){
  var box = el('div','grupos');
  d.grupos.forEach(function(g){
    var bloco = el('div'); bloco.setAttribute('data-grupo', g.nome);
    bloco.style.display='flex'; bloco.style.flexDirection='column'; bloco.style.gap='4px';
    bloco.appendChild(el('div','grupo-rot', g.nome));
    var pilha = el('div','pilha');
    g.segmentos.forEach(function(s){
      var seg = el('span',null, s.rotulo||'');
      seg.style.width = (s.pct||0)+'%'; seg.style.background = cor(s.cor);
      pilha.appendChild(seg);
    });
    bloco.appendChild(pilha);
    var leg = el('div','legenda'); leg.setAttribute('data-legenda','');
    g.legenda.forEach(function(l){
      var s = el('span');
      var sw = el('span','swatch'); sw.style.background = cor(l.cor);
      s.appendChild(sw); s.appendChild(document.createTextNode(l.texto));
      leg.appendChild(s);
    });
    bloco.appendChild(leg);
    box.appendChild(bloco);
  });
  caixa.appendChild(box);
}

  var box = el('div','faixas');
  d.faixas.forEach(function(f){
    var r = el('div','faixa');
    r.setAttribute('data-faixa', f.rotulo);
    r.style.gridTemplateColumns = d.colunas || '148px minmax(0, 1fr) 54px';
    r.appendChild(el('span','faixa-rot', f.rotulo));
    var t = el('span','faixa-trilho');

    r.appendChild(el('span','faixa-val', f.valor));

/* ----- dispersão ----- */

  var box = el('div','disp');
  var corpo = el('div','disp-corpo');
  var y = el('div','disp-y');
  (d.eixoY||[]).forEach(function(t){ y.appendChild(el('span',null,t)); });

  var area = el('div','disp-area'); area.setAttribute('data-area-de-desenho','');
  (d.pontos||[]).forEach(function(p){
    var n = el('div','disp-ponto'); n.setAttribute('data-ponto', p.id);
    n.style.left = p.left+'%'; n.style.bottom = p.bottom+'%';
    n.appendChild(el('b',null,p.id));
    var bola = el('span','disp-bola');
    bola.style.width = p.tam+'px'; bola.style.height = p.tam+'px'; bola.style.background = cor(p.cor);
    n.appendChild(bola); area.appendChild(n);
  });
  corpo.appendChild(area); box.appendChild(corpo);
  var xr = el('div','disp-x'); xr.appendChild(el('span'));

  if(d.legenda && d.legenda.length){

/* ----- mapa de UFs ----- */
function mapa(caixa, d){
  var box = el('div','mapa');
  d.ufs.forEach(function(u){
    var c = el('div', u.op==null ? 'uf uf-vazia' : 'uf');
    c.setAttribute('data-uf', u.uf);
    c.style.gridColumn = u.col; c.style.gridRow = u.row;
    if(u.op!=null){
      var f = el('span','uf-fundo'); f.style.background = cor(u.cor); f.style.opacity = u.op;
      c.appendChild(f);
    }

    val.style.color = u.claro ? 'var(--on-fill)' : 'var(--subtle)';
    c.appendChild(sig); c.appendChild(val);
    box.appendChild(c);
  });
  caixa.appendChild(box);

/* ----- rosca ----- */
function rosca(caixa, d){
  var box = el('div','rosca');
  var s = '<svg viewBox="0 0 150 150" aria-hidden="true">';
  s += '<circle cx="75" cy="75" r="52" fill="none" style="stroke:'+cor(d.trilha)+'" stroke-width="20"></circle>';
  (d.arcos||[]).forEach(function(a){
    s += '<circle cx="75" cy="75" r="52" fill="none" style="stroke:'+cor(a.cor)+'" stroke-width="20" stroke-dasharray="'+a.da+'" stroke-dashoffset="'+a.off+'" transform="rotate(-90 75 75)"></circle>';
  });
  s += '<text x="75" y="75" style="fill:var(--ink);font:600 19px var(--font-mono)" text-anchor="middle">'+esc(d.centro.valor)+'</text>';
  s += '<text x="75" y="75" dy="16" style="fill:var(--subtle);font:500 9.5px var(--font-ui)" text-anchor="middle">'+esc(d.centro.rotulo)+'</text>';
  s += '</svg>';
  var ul = '<ul data-legenda="">';
  (d.itens||[]).forEach(function(it){
    ul += '<li><span class="swatch" style="width:8px;height:8px;background:'+cor(it.cor)+'"></span><span>'+esc(it.nome)+'</span><b>'+esc(it.valor)+'</b></li>';
  });
  ul += '</ul>';
  box.innerHTML = s + ul;
  caixa.appendChild(box);
}

/* =========================================================
   GRAFICOS EM SVG (redesenhados na largura real)
   ========================================================= */
function medirGraficos(){
  graficos.forEach(function(g){
    var w = g.box.clientWidth || 340;
    g.box.innerHTML = desenhar(g.tipo, g.d, w, g.h);
  });
}
var pend = null;
function agenda(){ if(pend) return; pend = requestAnimationFrame(function(){ pend=null; medirGraficos(); }); }
window.addEventListener('resize', agenda);

function desenhar(tipo, d, w, h){
  if(tipo==='gBarras') return gBarras(d, w, h);
  if(tipo==='gLinha') return gLinha(d, w, h);
  return gEmpilhadas(d, w, h);
}

function legendaHtml(itens){
  var s = '<div class="gr-leg">';
  itens.forEach(function(i){
    s += '<span><i style="background:'+i.cor+'"></i><span style="color:'+i.cor+'">'+esc(i.nome)+'</span></span>';
  });
  return s + '</div>';
}
function passoRotulos(cats, largura){
  var precisa = cats.reduce(function(a,c){ return a + c.length*5.6 + 10; }, 0);
  return Math.max(1, Math.ceil(precisa/Math.max(largura,1)));
}
function escalaY(v, dom, y0, y1){
  var a = dom[0], b = dom[1];
  if(b===a) return (y0+y1)/2;
  return y1 - (v-a)/(b-a)*(y1-y0);
}
function eixoY(cortes, dom, x, y0, y1, ancora){
  var s='';
  cortes.forEach(function(v){
    var y = escalaY(v, dom, y0, y1);
    s += '<text x="'+x+'" y="'+(y+3)+'" text-anchor="'+ancora+'" style="fill:var(--faint);font:500 9px var(--font-mono)">'+esc(num(v))+'</text>';
  });
  return s;
}
function grade(cortes, dom, x0, x1, y0, y1, zero){
  var s='';
  cortes.forEach(function(v){
    var y = escalaY(v, dom, y0, y1);
    s += '<line x1="'+x0+'" y1="'+y+'" x2="'+x1+'" y2="'+y+'" style="stroke:var(--grid)" stroke-width="1"></line>';
  });
  if(zero && dom[0] < 0 && dom[1] > 0){
    var yz = escalaY(0, dom, y0, y1);
    s += '<line x1="'+x0+'" y1="'+yz+'" x2="'+x1+'" y2="'+yz+'" style="stroke:var(--border-2)" stroke-width="1.25"></line>';
  }
  return s;
}
function r1(v){ return Math.round(v*10)/10; }

/* ---------- barras verticais agrupadas (+ linha secundaria) ---------- */
function gBarras(d, w, h){
  var cats = d.categorias, series = d.barras || [];
  var temLeg = !!d.comLegenda, temSec = !!d.linhaSecundaria;
  var legHtml = '';
  if(temLeg){
    var itens = series.map(function(s,i){ return {nome:s.nome, cor:cor(s.cor)||SERIES[i]}; });
    if(temSec) itens.push({nome:d.linhaSecundaria.nome, cor:cor(d.linhaSecundaria.cor)});
    legHtml = legendaHtml(itens);
  }
  var hs = Math.max(h - (temLeg?22:0), 80);
  var mL = 44, mR = temSec ? 46 : 14, mT = 10, mB = 26;
  var x0 = mL, x1 = Math.max(w - mR, mL+40), y0 = mT, y1 = hs - mB;
  var s = '<svg width="'+w+'" height="'+hs+'" viewBox="0 0 '+w+' '+hs+'" role="presentation">';
  s += grade(d.eixo.cortes, d.eixo.dominio, x0, x1, y0, y1, d.eixo.temLinhaDeZero);
  s += eixoY(d.eixo.cortes, d.eixo.dominio, mL-7, y0, y1, 'end');
  if(temSec) s += eixoY(d.eixoSecundario.cortes, d.eixoSecundario.dominio, x1+7, y0, y1, 'start');

  var banda = (x1-x0)/cats.length;
  var n = series.length || 1;
  var larguraGrupo = Math.min(banda*0.66, 46);
  var bw = Math.max(larguraGrupo/n, 2);
  var base = escalaY(Math.max(d.eixo.dominio[0],0), d.eixo.dominio, y0, y1);
  series.forEach(function(se, si){
    var c = cor(se.cor) || SERIES[si];
    se.valores.forEach(function(v, i){
      var cx = x0 + banda*i + banda/2 - larguraGrupo/2 + bw*si;
      var y = escalaY(v, d.eixo.dominio, y0, y1);
      var alt = Math.max(base - y, 1);
      s += '<rect x="'+r1(cx)+'" y="'+r1(y)+'" width="'+r1(Math.max(bw-1.5,1.2))+'" height="'+r1(alt)+'" rx="2.5" style="fill:'+c+'"></rect>';
    });
  });
  if(temSec){
    var ls = d.linhaSecundaria, dom2 = d.eixoSecundario.dominio, pts=[];
    ls.valores.forEach(function(v,i){ pts.push([x0+banda*i+banda/2, escalaY(v, dom2, y0, y1)]); });
    s += '<path d="'+pts.map(function(p,i){ return (i?'L':'M')+r1(p[0])+' '+r1(p[1]); }).join(' ')+'" fill="none" style="stroke:'+cor(ls.cor)+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>';
    pts.forEach(function(p,i){
      var ult = i===pts.length-1;
      s += '<circle cx="'+r1(p[0])+'" cy="'+r1(p[1])+'" r="'+(ult?3:1.9)+'" style="fill:'+cor(ls.cor)+';stroke:var(--surface)" stroke-width="1.2"></circle>';
    });
  }
  var passo = passoRotulos(cats, x1-x0);
  cats.forEach(function(c, i){
    if(i % passo) return;
    s += '<text x="'+r1(x0+banda*i+banda/2)+'" y="'+(y1+15)+'" text-anchor="middle" style="fill:var(--faint);font:500 9px var(--font-mono)">'+esc(c)+'</text>';
  });
  return legHtml + s + '</svg>';
}

/* ---------- linha (uma ou varias series) + referencia ---------- */
function gLinha(d, w, h){
  var pts = d.pontos, extras = d.linhas || [];
  var temLeg = extras.length > 0;
  var legHtml = '';
  if(temLeg){
    var itens = [{nome:d.nome, cor:'var(--s1)'}];
    extras.forEach(function(l,i){ itens.push({nome:l.nome, cor:cor(l.cor)||SERIES[i+1]}); });
    legHtml = legendaHtml(itens);
  }
  var hs = Math.max(h - (temLeg?22:0), 80);
  var mL = 44, mR = 16, mT = d.referencia ? 22 : 10, mB = 26;
  var x0 = mL, x1 = Math.max(w - mR, mL+40), y0 = mT, y1 = hs - mB;
  var dom = d.eixo.dominio;
  var s = '<svg width="'+w+'" height="'+hs+'" viewBox="0 0 '+w+' '+hs+'" role="presentation">';
  s += grade(d.eixo.cortes, dom, x0, x1, y0, y1, d.eixo.temLinhaDeZero);
  s += eixoY(d.eixo.cortes, dom, mL-7, y0, y1, 'end');

  var passoX = pts.length>1 ? (x1-x0)/(pts.length-1) : 0;
  function cx(i){ return x0 + passoX*i; }
  var caminho = pts.map(function(p,i){ return (i?'L':'M')+r1(cx(i))+' '+r1(escalaY(p.valor, dom, y0, y1)); }).join(' ');

  if(!temLeg){
    var baseY = escalaY(Math.max(dom[0],0), dom, y0, y1);
    s += '<path d="'+caminho+' L'+r1(cx(pts.length-1))+' '+r1(baseY)+' L'+r1(x0)+' '+r1(baseY)+' Z" style="fill:var(--s1);opacity:.09"></path>';
  }
  s += '<path d="'+caminho+'" fill="none" style="stroke:var(--s1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>';
  pts.forEach(function(p,i){
    var ult = i===pts.length-1;
    s += '<circle cx="'+r1(cx(i))+'" cy="'+r1(escalaY(p.valor, dom, y0, y1))+'" r="'+(ult?3.4:2)+'" style="fill:var(--s1);stroke:var(--surface)" stroke-width="1.3"></circle>';
  });
  extras.forEach(function(l, li){
    var c = cor(l.cor) || SERIES[li+1];
    var cam = l.valores.map(function(v,i){ return (i?'L':'M')+r1(cx(i))+' '+r1(escalaY(v, dom, y0, y1)); }).join(' ');
    s += '<path d="'+cam+'" fill="none" style="stroke:'+c+'" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path>';
    var ui = l.valores.length-1;
    s += '<circle cx="'+r1(cx(ui))+'" cy="'+r1(escalaY(l.valores[ui], dom, y0, y1))+'" r="3" style="fill:'+c+';stroke:var(--surface)" stroke-width="1.3"></circle>';
  });
  if(d.referencia){
    var yr = escalaY(d.referencia.valor, dom, y0, y1);
    var yl = (yr>=y0-2 && yr<=y1+2) ? yr : y0+2;
    s += '<line x1="'+x0+'" y1="'+r1(yl)+'" x2="'+x1+'" y2="'+r1(yl)+'" style="stroke:var(--meta)" stroke-width="1.2" stroke-dasharray="4 3"></line>';
    var rot = d.referencia.rotulo, larg = rot.length*5.4+14;
    s += '<rect x="'+r1(x1-larg)+'" y="'+r1(yl-16)+'" width="'+r1(larg)+'" height="14" rx="7" style="fill:var(--surface);stroke:var(--meta)" stroke-width="1" stroke-dasharray="3 2"></rect>';
    s += '<text x="'+r1(x1-larg/2)+'" y="'+r1(yl-6)+'" text-anchor="middle" style="fill:var(--meta);font:500 8.5px var(--font-mono)">'+esc(rot)+'</text>';
  }
  var cats = pts.map(function(p){ return p.categoria; });
  var passo = passoRotulos(cats, x1-x0);
  cats.forEach(function(c,i){
    if(i % passo) return;
    s += '<text x="'+r1(cx(i))+'" y="'+(y1+15)+'" text-anchor="middle" style="fill:var(--faint);font:500 9px var(--font-mono)">'+esc(c)+'</text>';
  });
  return legHtml + s + '</svg>';
}

/* ---------- barras empilhadas horizontais ---------- */
function gEmpilhadas(d, w, h){
  var cats = d.categorias, faixas = d.faixas || [];
  var legHtml = legendaHtml(faixas.map(function(f,i){ return {nome:f.nome, cor:cor(f.cor)||SERIES[i]}; }));
  var hs = Math.max(h - 22, 80);
  var maiorRot = cats.reduce(function(a,c){ return Math.max(a, c.length); }, 0);
  var mL = Math.min(Math.max(maiorRot*5.9+8, 56), 128), mR = 14, mT = 6, mB = 22;
  var x0 = mL, x1 = Math.max(w - mR, mL+40), y0 = mT, y1 = hs - mB;
  var dom = d.eixo.dominio;
  function ex(v){ return x0 + (v-dom[0])/((dom[1]-dom[0])||1)*(x1-x0); }
  var s = '<svg width="'+w+'" height="'+hs+'" viewBox="0 0 '+w+' '+hs+'" role="presentation">';
  d.eixo.cortes.forEach(function(v){
    var x = ex(v);
    s += '<line x1="'+r1(x)+'" y1="'+y0+'" x2="'+r1(x)+'" y2="'+y1+'" style="stroke:var(--grid)" stroke-width="1"></line>';
    s += '<text x="'+r1(x)+'" y="'+(y1+14)+'" text-anchor="middle" style="fill:var(--faint);font:500 9px var(--font-mono)">'+esc(num(v))+'</text>';
  });
  var banda = (y1-y0)/cats.length, alt = Math.min(banda*0.62, 22);
  cats.forEach(function(c, i){
    var yc = y0 + banda*i + banda/2;
    s += '<text x="'+(mL-8)+'" y="'+r1(yc+3.2)+'" text-anchor="end" style="fill:var(--muted);font:500 9.5px var(--font-ui)">'+esc(c)+'</text>';
    var acc = 0;
    faixas.forEach(function(f, fi){
      var v = f.valores[i] || 0;
      var xa = ex(acc), xb = ex(acc+v);
      if(xb-xa > 0.3){
        s += '<rect x="'+r1(xa)+'" y="'+r1(yc-alt/2)+'" width="'+r1(xb-xa)+'" height="'+r1(alt)+'" rx="'+((fi===0||fi===faixas.length-1)?2.5:0)+'" style="fill:'+(cor(f.cor)||SERIES[fi])+'"></rect>';
      }
      acc += v;
    });
  });
  return legHtml + s + '</svg>';
}

/* =========================================================
   CHAT — pergunta ancorada no painel + redacao pela IA
   ========================================================= */
var sampleFn = null, sampleTentado = false, ocupado = false;
async function obterSample(){
  if(sampleTentado) return sampleFn;
  sampleTentado = true;
  try { sampleFn = (window.claude && claude.use) ? await claude.use('sample') : null; }
  catch(e){ sampleFn = null; }
  return sampleFn;
}

function semAcento(s){ return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
var VAZIAS = {'qual':1,'quais':1,'o':1,'a':1,'os':1,'as':1,'de':1,'do':1,'da':1,'dos':1,'das':1,'e':1,'em':1,'no':1,'na':1,'nos':1,'nas':1,'um':1,'uma':1,'que':1,'como':1,'esta':1,'esta?':1,'nosso':1,'nossa':1,'temos':1,'foi':1,'ano':1,'quanto':1,'quantos':1,'quantas':1,'para':1,'por':1,'com':1,'the':1};
function fichas(s){
  return semAcento(s).replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(function(t){ return t.length>2 && !VAZIAS[t]; });
}

/* indice de metricas de todas as telas */
var INDICE = [];
Object.keys(TELAS).forEach(function(rota){
  var tela = TELAS[rota], mod = modOf(rota);
  var nomeMod = META.modulos.filter(function(m){ return m.id===mod; })[0].nome;
  tela.k.forEach(function(k){
    var painel = melhorPainel(tela, k.r);
    INDICE.push({
      rota: rota, tela: tela.t, modulo: nomeMod,
      rotulo: k.r, valor: k.v, rodape: k.f,
      painel: painel ? painel.k : null,
      painelTit: painel ? painel.t : null,
      formula: painel ? painel.f : null,
      busca: fichas(k.r + ' ' + (k.f||'') + ' ' + (painel? painel.t + ' ' + (painel.f||'') : ''))
    });
  });
});
function melhorPainel(tela, rotulo){
  var alvo = fichas(rotulo), melhor = null, mp = 0;
  tela.p.forEach(function(p){
    var t = fichas(p.t + ' ' + (p.f||''));
    var pontos = alvo.filter(function(x){ return t.indexOf(x)>=0; }).length;
    if(pontos > mp){ mp = pontos; melhor = p; }
  });
  return melhor;
}
function localizar(pergunta){
  var q = fichas(pergunta);
  if(!q.length) return null;
  var melhor = null, mp = 0;
  INDICE.forEach(function(it){
    var pontos = 0;
    q.forEach(function(t){
      if(it.busca.indexOf(t) >= 0) pontos += 2;
      else if(it.busca.some(function(b){ return b.indexOf(t)===0 || t.indexOf(b)===0; })) pontos += 1;
    });
    if(it.rota === estado.rota) pontos += 1.5;
    if(pontos > mp){ mp = pontos; melhor = it; }
  });
  return mp >= 2 ? melhor : null;
}

var FONTES = {rh:'vw_fato_rh_mes', fin:'vw_fato_fin_mes', int:'vw_fato_int_mes'};
function rodapeTecnico(achado){
  var mod = modOf(achado.rota);
  return (achado.formula || 'apuracao direta do painel') +
         ' · fechamento ' + estado.filtros.ano + '-12-31' +
         ' · fonte ' + (FONTES[mod]||'vw_fato');
}
function recorteTexto(){
  var partes = [];
  META.filtros.forEach(function(f){
    var op = f.opcoes.filter(function(o){ return o[0]===estado.filtros[f.nome]; })[0];
    partes.push(f.rotulo + ': ' + (op?op[1]:estado.filtros[f.nome]));
  });
  return partes.join(', ');
}

function renderGuias(){
  var caixa = document.getElementById('chatGuias'); caixa.textContent='';
  (META.sugestoes[slug(estado.rota)]||[]).forEach(function(q){
    var b = el('button','guia',q); b.type='button'; b.setAttribute('data-teste','chat-guia');
    b.addEventListener('click', function(){ perguntar(q); });
    caixa.appendChild(b);
  });
}
function renderLog(){
  var log = document.getElementById('chatLog'); log.textContent='';
  if(!estado.turnos.length){
    log.appendChild(el('div','chat-intro','Pergunte aos dados desta tela ou de qualquer outra. A resposta traz o número, o que entrou na conta e a fórmula — e abre o gráfico certo, no recorte da pergunta.'));
    return;
  }
  estado.turnos.forEach(function(t){
    var b = el('div','bolha', t.pergunta); b.setAttribute('data-teste','chat-pergunta');
    log.appendChild(b);
    var turno = el('div','turno'); turno.setAttribute('data-teste','chat-turno');
    var cartao = el('div','resp-cartao'); cartao.setAttribute('data-teste','chat-resposta');
    if(t.estado==='consultando'){
      cartao.appendChild(el('p','estado','Consultando o painel…'));
    } else if(!t.achado){
      cartao.appendChild(el('p','resp-txt','Não encontrei essa métrica nos painéis publicados. Tente pelo nome do indicador — headcount, turnover, EBITDA, folha, inadimplência.'));
    } else {
      cartao.appendChild(el('div','resp-cabeca', t.achado.rotulo + ': ' + t.achado.valor));
      if(t.estado==='redigindo'){
        cartao.appendChild(el('p','estado','Número conferido. Redigindo a leitura…'));
      } else {
        var p = el('p','resp-txt', t.texto); cartao.appendChild(p);
      }
      var fm = el('p','resp-formula', rodapeTecnico(t.achado)); fm.setAttribute('data-teste','chat-formula');
      cartao.appendChild(fm);
      if(t.definicao){
        var det = document.createElement('details');
        var sum = document.createElement('summary'); sum.textContent='definição registrada';
        det.appendChild(sum); det.appendChild(el('p',null,t.definicao));
        cartao.appendChild(det);
      }
      if(t.sugestoes && t.sugestoes.length){
        var at = el('div','atalhos'); at.setAttribute('data-teste','chat-atalhos');
        at.appendChild(el('span','rotulete','para continuar'));
        t.sugestoes.forEach(function(q){
          var b2 = el('button','atalho',q); b2.type='button';
          b2.addEventListener('click', function(){ perguntar(q); });
          at.appendChild(b2);
        });
        cartao.appendChild(at);
      }
    }
    turno.appendChild(cartao);
    if(t.achado){
      var ac = el('div','acoes'); ac.setAttribute('data-teste','chat-acoes');
      ac.appendChild(el('span','rotulete','ações aplicadas'));
      var chips = el('div'); chips.style.display='flex'; chips.style.flexWrap='wrap'; chips.style.gap='5px';
      chips.appendChild(el('span','acao-chip','Tela: ' + t.achado.modulo + ' · ' + t.achado.tela));
      ac.appendChild(chips);
      var linha = el('div','acao-linha');
      var ver = el('button','acao-forte','Ver o gráfico'); ver.type='button';
      ver.setAttribute('data-teste','chat-ver-grafico');
      ver.addEventListener('click', function(){ ir(t.achado.rota, t.achado.painel); });
      var des = el('button','acao-leve','Desfazer'); des.type='button';
      des.setAttribute('data-teste','chat-desfazer');
      des.addEventListener('click', function(){ ir(t.achado.rota, null); });
      linha.appendChild(ver); linha.appendChild(des);
      ac.appendChild(linha);
      turno.appendChild(ac);
    }
    log.appendChild(turno);
  });
  log.scrollTop = log.scrollHeight;
}

function abrirChat(v){
  estado.chatAberto = v;
  document.getElementById('chat').classList.toggle('oculto', !v);
  document.getElementById('flutuante').classList.toggle('oculto', v);
  if(v){ renderGuias(); renderLog(); agenda(); setTimeout(function(){ document.getElementById('chatCampo').focus(); }, 30); }
  else agenda();
}

async function perguntar(pergunta){
  pergunta = String(pergunta||'').trim();
  if(!pergunta || ocupado) return;
  if(!estado.chatAberto) abrirChat(true);
  ocupado = true;
  var turno = {pergunta:pergunta, estado:'consultando', achado:null, texto:'', definicao:'', sugestoes:[]};
  estado.turnos.push(turno); renderLog();

  var achado = localizar(pergunta);
  turno.achado = achado;
  if(!achado){ turno.estado='pronta'; ocupado=false; renderLog(); return; }
  if(achado.painel) ir(achado.rota, achado.painel);
  turno.estado = 'redigindo'; renderLog();

  var s = await obterSample();
  if(!s){
    turno.texto = achado.rotulo + ' foi ' + achado.valor + ' no recorte selecionado (' + achado.rodape + '). Painel de origem: ' + achado.tela + ' · ' + (achado.painelTit||'—') + '.';
    turno.definicao = 'Leitura apurada direto do painel. A redação pela IA precisa da permissão de uso do Claude nesta página.';
    turno.estado='pronta'; ocupado=false; renderLog(); return;
  }

  var mesmaTela = INDICE.filter(function(i){ return i.rota===achado.rota; })
    .map(function(i){ return '- ' + i.rotulo + ': ' + i.valor + ' (' + (i.rodape||'') + ')'; }).join('\n');
  var outras = Object.keys(TELAS).filter(function(r){ return r!==achado.rota; })
    .map(function(r){ return TELAS[r].t + ': ' + TELAS[r].k.map(function(k){ return k.r+' '+k.v; }).join('; '); }).join('\n');

  var prompt =
"Voce e o copiloto de um painel executivo de controladoria (RH e Financeiro) de uma empresa brasileira. Escreve como um controller senior: direto, tecnico, sem adjetivos de venda, sem emoji, em portugues do Brasil.\n\n" +
"REGRA DURA: os numeros ja foram apurados pelo painel. Use EXATAMENTE os valores abaixo, copiados caractere a caractere. Nunca recalcule, arredonde ou invente numero algum. Se a pergunta pedir algo que nao esta nos dados, diga o que falta.\n\n" +
"PERGUNTA: " + pergunta + "\n\n" +
"METRICA LOCALIZADA\n" +
"- indicador: " + achado.rotulo + "\n- valor: " + achado.valor + "\n- observacao do painel: " + (achado.rodape||'-') + "\n" +
"- tela: " + achado.modulo + " / " + achado.tela + "\n- painel: " + (achado.painelTit||'-') + "\n- formula registrada: " + (achado.formula||'-') + "\n\n" +
"RECORTE ATUAL: " + recorteTexto() + "\n\n" +
"OUTROS NUMEROS DESTA TELA\n" + mesmaTela + "\n\n" +
"RESUMO DAS DEMAIS TELAS\n" + outras + "\n\n" +
"Responda SOMENTE com este JSON, sem texto fora dele:\n" +
'{"texto":"2 a 4 frases: o numero com a unidade, o que ele significa em linguagem de negocio e uma leitura util (tendencia, comparacao com outro numero desta tela ou risco). Termine com uma pergunta curta oferecendo o proximo corte.","definicao":"1 a 2 frases sobre como a metrica e medida e o cuidado de leitura (estoque x fluxo, base do denominador, defasagem).","sugestoes":["pergunta curta de continuidade","outra pergunta curta"]}';

  try{
    var r = await s.json(prompt, {modelTier:'quick', cache:false});
    turno.texto = String(r && r.texto || '').trim() || (achado.rotulo + ' foi ' + achado.valor + '.');
    turno.definicao = String(r && r.definicao || '').trim();
    turno.sugestoes = Array.isArray(r && r.sugestoes) ? r.sugestoes.slice(0,3).map(String) : [];
  }catch(e){
    turno.texto = achado.rotulo + ' foi ' + achado.valor + ' no recorte selecionado (' + achado.rodape + ').';
    turno.definicao = (e && e.code==='not_granted')
      ? 'A redacao pela IA depende da sua permissao de uso do Claude nesta pagina; o numero acima vem direto do painel.'
      : 'Numero conferido no painel. A redacao pela IA nao completou desta vez.';
  }
  turno.estado='pronta'; ocupado=false; renderLog();
}

lerHash();
