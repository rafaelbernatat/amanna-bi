# O catálogo de métricas (PRD seção 9.4, T-112 e T-113)
#
# "Um arquivo versionado, revisado por Controladoria e RH em conjunto. É aqui
# que a divergência de definição entre áreas vira uma decisão registrada em vez
# de um ajuste silencioso."
#
# ---------------------------------------------------------------------------
# ESTAS 21 ENTRADAS SÃO PROVISÓRIAS
# ---------------------------------------------------------------------------
#
# São as 21 métricas do Anexo B do PRD, escritas pela Engenharia sob a decisão
# de modo mockup de 2026-08-24 (docs/decisoes/D-H03-modo-mockup.md), que
# autoriza dado fictício enquanto o objetivo for aprovar gráficos e telas.
#
# O que a decisão **não** autoriza: escrever que uma métrica foi aprovada. O
# campo `decisao` de cada entrada diz que ela é provisória e nomeia H-08, que é
# a sessão de Controladoria e RH onde as definições passam a valer.
#
# A diferença importa e é o motivo de a seção 9.4 existir: `sentido` diz se o
# número subindo é bom ou ruim, `meta` é um alvo acordado, e `formula` é a
# definição que as áreas precisam assinar. Um catálogo com aparência de aprovado
# que ninguém aprovou é exatamente o "ajuste silencioso" que este arquivo existe
# para impedir.
#
# `meta` está ausente em vinte das vinte e uma: meta é alvo acordado, e ausência
# é "não há meta", nunca "meta zero". A única presente é a de turnover, que o
# próprio PRD escreve na seção 9.4.
#
# ---------------------------------------------------------------------------
# Ao acrescentar uma métrica
# ---------------------------------------------------------------------------
#
#   rotulo       obrigatório  como aparece na tela
#   fonte        obrigatório  a view da seção 10.1
#   formula      obrigatório  como o número é obtido (PR-3)
#   unidade      obrigatório  BRL_mi | pct | pp | dias | FTE | horas | contagem | pontos | anos
#   agg          obrigatório  sum | last | ratio
#   sentido      obrigatório  maior_melhor | menor_melhor | neutro
#   grao_minimo  obrigatório  nunca mais fino que [area, mes] (seção 11)
#   sinonimos    obrigatório  como as pessoas chamam; sem isto o chat não acha
#   meta         opcional     ausente é "não há meta", nunca "meta zero"
#   decisao      opcional     obrigatória quando a definição foi discutida

# ---------------------------------------------------------------------------
# 1 · Crescimento
# ---------------------------------------------------------------------------

crescimento_yoy:
  rotulo: Crescimento anual
  fonte: vw_fato_fin_mes
  formula: receita_liquida(ano) / receita_liquida(ano anterior) - 1
  unidade: pct
  agg: ratio
  sentido: maior_melhor
  grao_minimo: [entidade, mes]
  sinonimos:
    [
      crescimento,
      yoy,
      ano contra ano,
      ano anterior,
      evolucao da receita,
      cresceu,
    ]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Comparacao contra o mesmo periodo do ano
    anterior, nao contra o periodo imediatamente anterior. Nao aprovado por
    Controladoria: a sessao e H-08.

# ---------------------------------------------------------------------------
# 2 · Turnover e retenção
# ---------------------------------------------------------------------------

turnover_12m:
  rotulo: Turnover 12 meses
  fonte: vw_fato_rh_mes
  formula: soma(desligamentos, 12m) / media(headcount_fte, 12m)
  unidade: pct
  agg: ratio
  sentido: menor_melhor
  meta: 14.0
  grao_minimo: [area, mes]
  sinonimos: [turnover, rotatividade, saidas, atrito, quem sai]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). A secao 9.4 do PRD traz, como EXEMPLO de
    preenchimento, a frase "transferencia interna nao conta como desligamento,
    aprovado por RH e Controladoria em 2026-08". Essa aprovacao nao aconteceu:
    a secao 18 do mesmo PRD lista P2 como decisao PENDENTE, e o item H-06 ainda
    esta aberto. O exemplo foi transcrito para ca em T-112 e vira afirmacao
    quando sai da ilustracao. Ate H-06 fechar, a regra de transferencia interna
    esta indefinida e o numero e mockup.

retencao_12m:
  rotulo: Retenção 12 meses
  fonte: vw_fato_rh_mes
  formula: 1 - turnover_12m
  unidade: pct
  agg: ratio
  sentido: maior_melhor
  grao_minimo: [area, mes]
  sinonimos: [retencao, permanencia, quem fica, quem permanece]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). E o complemento exato do turnover, entao
    herda a indefinicao de P2 (H-06). Se transferencia interna passar a contar
    como desligamento, os dois numeros mudam juntos.

# ---------------------------------------------------------------------------
# 3 · Resultado
# ---------------------------------------------------------------------------

margem_ebitda:
  rotulo: Margem EBITDA
  fonte: vw_fato_fin_mes
  formula: (receita_liquida - cmv - despesas_operacionais) / receita_liquida
  unidade: pct
  agg: ratio
  sentido: maior_melhor
  grao_minimo: [entidade, mes]
  sinonimos: [margem ebitda, resultado operacional, lucro operacional]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). EBITDA obtido por diferenca, e nao por soma
    de contas de resultado. Nao aprovado por Controladoria: a sessao e H-08.

# ---------------------------------------------------------------------------
# 4 · Caixa
# ---------------------------------------------------------------------------

saldo_caixa:
  rotulo: Saldo de caixa
  fonte: vw_fato_fin_mes
  formula: saldo_inicial + soma(entradas_de_caixa - saidas_de_caixa, ate o mes)
  unidade: BRL_mi
  agg: last
  sentido: maior_melhor
  grao_minimo: [entidade, mes]
  sinonimos: [caixa, saldo, disponibilidade, quanto tem em caixa]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Estoque: agrega por `last`, nunca por soma
    ao longo do periodo. Somar saldos de doze meses da um numero que nao existe.

# ---------------------------------------------------------------------------
# 5 · Orçamento
# ---------------------------------------------------------------------------

desvio_orcamentario:
  rotulo: Desvio orçamentário
  fonte: vw_fato_orcamento
  formula: soma(realizado) - soma(orcado)
  unidade: BRL_mi
  agg: sum
  sentido: menor_melhor
  grao_minimo: [centro_custo, mes]
  sinonimos: [desvio, orcamento, estouro, centro de custo]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Positivo e estouro. O sentido
    `menor_melhor` trata gastar menos que o orcado como melhor, o que nem
    sempre e verdade -- economia por projeto nao executado tambem aparece assim.
    E uma das definicoes que precisam de Controladoria em H-08.

# ---------------------------------------------------------------------------
# 6 · Quadro
# ---------------------------------------------------------------------------

headcount_fte:
  rotulo: Headcount FTE
  fonte: vw_fato_rh_mes
  formula: saldo_de_abertura + soma(admissoes - desligamentos, ate o mes)
  unidade: FTE
  agg: last
  sentido: neutro
  grao_minimo: [area, mes]
  sinonimos: [headcount, quadro, fte, pessoas, colaboradores, tamanho do time]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Estoque, nao fluxo: o quadro de marco e a
    soma das areas em marco, nunca a soma de janeiro a marco. Sentido neutro
    porque crescer nao e bom nem ruim sozinho -- depende da receita.

perfil_quadro:
  rotulo: Perfil do quadro
  fonte: vw_fato_rh_mes
  formula: headcount_fte quebrado por modalidade de trabalho
  unidade: FTE
  agg: last
  sentido: neutro
  grao_minimo: [modalidade, mes]
  sinonimos:
    [perfil, genero, modalidade, presencial, hibrido, remoto, composicao]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Hoje quebra so por modalidade de trabalho.
    Genero depende das dimensoes vw_dim_* de T-147.

distribuicao_etaria:
  rotulo: Distribuição por faixa etária
  fonte: vw_dim_faixa_etaria
  formula: headcount_fte quebrado por faixa etaria
  unidade: FTE
  agg: last
  sentido: neutro
  grao_minimo: [faixa, mes]
  sinonimos: [idade, faixa etaria, tempo de casa, escolaridade, senioridade]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). A view de dimensao ainda nao existe --
    e T-147. A secao 11 exige que faixa com menos de 5 pessoas nao seja
    exibida, e quem aplica isso e T-151.

distribuicao_uf:
  rotulo: Distribuição por estado
  fonte: vw_dim_uf
  formula: headcount_fte quebrado por unidade federativa
  unidade: FTE
  agg: last
  sentido: neutro
  grao_minimo: [uf, mes]
  sinonimos: [estado, uf, geografia, mapa, onde estao, distribuicao geografica]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). A view de dimensao ainda nao existe --
    e T-147.

# ---------------------------------------------------------------------------
# 7 · Integração RH × Financeiro
# ---------------------------------------------------------------------------

receita_por_fte:
  rotulo: Receita por colaborador
  fonte: vw_fato_fin_mes, vw_fato_rh_mes
  formula: soma(receita_liquida) / headcount_fte(ultimo mes do recorte)
  unidade: BRL_mi
  agg: ratio
  sentido: maior_melhor
  grao_minimo: [entidade, mes]
  sinonimos: [receita por colaborador, produtividade, receita por fte, rpc]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Unica metrica que cruza duas views, e o
    grao dela e o da mais grossa: receita nao tem area (secao 10.1), entao a
    razao tambem nao tem. Quebrar por area exigiria ratear receita por quadro,
    que e arbitragem e nao recorte -- ver H-04 e T-144.

# ---------------------------------------------------------------------------
# 8 · Contas e ciclo
# ---------------------------------------------------------------------------

inadimplencia:
  rotulo: Inadimplência
  fonte: vw_fato_contas
  formula: a_receber(acima de 90 dias, fim da janela) / a_receber(fim da janela)
  unidade: pct
  agg: ratio
  sentido: menor_melhor
  grao_minimo: [faixa, mes]
  sinonimos: [inadimplencia, aging, recebiveis, atraso, vencido, calote]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Conta so a faixa ACIMA DE 90 DIAS, que e o
    que o rodape do cartao no prototipo declara: "R$ 7 mi sobre R$ 171 mi".
    Contar tudo fora de "a vencer" -- inclusive 1 a 30 dias -- levaria a taxa
    de 4,1% para 31%, e parte das empresas conta assim. E uma das definicoes
    que precisam de Controladoria em H-08.

ciclo_financeiro:
  rotulo: Ciclo de conversão de caixa
  fonte: vw_fato_contas
  formula: >-
    pmr + pme - pmp, com pmr = a_receber / receita_liquida * 365,
    pme = estoque / cmv * 365 e pmp = a_pagar / cmv * 365
  unidade: dias
  agg: ratio
  sentido: menor_melhor
  grao_minimo: [entidade, mes]
  sinonimos: [ciclo, ciclo financeiro, capital de giro]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Usa 365 dias e o CMV como denominador de
    PME e PMP. Compras do periodo seria o denominador mais correto para o PMP,
    e a fixture nao tem essa medida. Precisa de Controladoria em H-08.

# ---------------------------------------------------------------------------
# 9 · Recrutamento
# ---------------------------------------------------------------------------

tempo_fechamento:
  rotulo: Tempo médio de fechamento
  fonte: vw_fato_vagas
  formula: soma(dias_somados) / soma(fechadas)
  unidade: dias
  agg: ratio
  sentido: menor_melhor
  grao_minimo: [area, mes]
  sinonimos:
    [tempo de fechamento, dias para fechar, time to fill, demora da vaga]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Conta so vagas FECHADAS, entao vaga aberta
    ha muito tempo nao entra na media -- e o vies classico dessa metrica, que
    melhora quando as vagas dificeis simplesmente nao fecham.

vagas_status:
  rotulo: Vagas por status
  fonte: vw_fato_vagas
  formula: soma(abertas + em_andamento + fechadas + canceladas)
  unidade: contagem
  agg: sum
  sentido: neutro
  grao_minimo: [area, mes]
  sinonimos: [vagas, status das vagas, abertas, fechadas, canceladas, posicoes]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Unidade `contagem`, que entrou no enum em
    2026-08-24 (D-H45): vaga nao e pessoa, entao `FTE` afirmaria algo falso.

# ---------------------------------------------------------------------------
# 10 · Treinamento
# ---------------------------------------------------------------------------

horas_treinamento:
  rotulo: Horas de treinamento
  fonte: vw_fato_treinamento
  formula: soma(horas)
  unidade: horas
  agg: sum
  sentido: maior_melhor
  grao_minimo: [area, mes]
  sinonimos:
    [treinamento, horas de treinamento, capacitacao, desenvolvimento, trilhas]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Unidade `horas`, que entrou no enum em
    2026-08-24 (D-H45). Sentido `maior_melhor` trata mais horas como melhor, o
    que ignora a conclusao -- o proprio dataset mostra 21.400 horas com 64% de
    conclusao. Precisa de RH em H-08.

# ---------------------------------------------------------------------------
# 11 · Folha e salários
# ---------------------------------------------------------------------------

folha_total:
  rotulo: Folha total
  fonte: vw_fato_rh_mes
  formula: soma(folha)
  unidade: BRL_mi
  agg: sum
  sentido: neutro
  grao_minimo: [area, mes]
  sinonimos: [folha, custo de pessoal, salarios, quanto custa a equipe]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). A base de competencia da rescisao esta
    indefinida -- e a decisao P3, item H-07. A escolha muda a folha de todo mes
    com desligamento, e com ela folha sobre receita e custo por colaborador.

salario_medio:
  rotulo: Salário médio
  fonte: vw_fato_rh_mes
  formula: soma(folha, no recorte) / (media(headcount_fte, no recorte) * meses)
  unidade: BRL_mi
  agg: ratio
  sentido: neutro
  grao_minimo: [area, mes]
  sinonimos: [salario, salario medio, remuneracao, faixa salarial, quanto paga]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Sai da folha inteira dividida pelo quadro,
    entao inclui encargos, beneficios e variavel -- nao e salario contratual. A
    unidade e `BRL_mi` porque e a unica monetaria do enum; a escala de exibicao
    e da apresentacao (regra 2). Precisa de RH em H-08.

# ---------------------------------------------------------------------------
# 12 · Clima e engajamento
# ---------------------------------------------------------------------------

absenteismo:
  rotulo: Absenteísmo
  fonte: vw_fato_rh_mes
  formula: soma(horas_ausentes) / soma(horas_previstas)
  unidade: pct
  agg: ratio
  sentido: menor_melhor
  grao_minimo: [area, mes]
  sinonimos: [absenteismo, faltas, ausencia, afastamento, atestado]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). O que entra em "horas ausentes" -- ferias,
    licenca medica, falta injustificada -- muda o numero e nao esta definido.
    Precisa de RH em H-08.

enps:
  rotulo: eNPS
  fonte: vw_fato_rh_mes
  formula: (soma(promotores) - soma(detratores)) / soma(respondentes) * 100
  unidade: pontos
  agg: ratio
  sentido: maior_melhor
  grao_minimo: [area, mes]
  sinonimos: [enps, nps interno, detratores, recomendaria a empresa]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Unidade `pontos`, que entrou no enum em
    2026-08-24 (D-H45): o eNPS vai de -100 a +100 e e a diferenca entre duas
    proporcoes, entao `pct` afirmaria que ele e uma proporcao. Nao se soma ao
    longo do periodo.

engajamento_area:
  rotulo: Engajamento por área
  fonte: vw_fato_rh_mes
  formula: soma(pontos_de_engajamento) / soma(respondentes)
  unidade: pct
  agg: ratio
  sentido: maior_melhor
  grao_minimo: [area, mes]
  sinonimos: [engajamento, clima, satisfacao, pesquisa de clima, moral]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Media ponderada por respondente, e nao
    media das medias por area -- as duas dao numeros diferentes quando as areas
    tem tamanhos diferentes. A cobertura da pesquisa e de 74% do quadro, e o
    numero fala pelos que responderam.

# ===========================================================================
# As métricas do achado 5 (T-148)
# ===========================================================================
#
# O achado 5 do Anexo D lista KPIs que o protótipo mostra cravados, sem
# responder a filtro nenhum. Cada um destes existe para que aquele número passe
# a ser calculado — a origem (view, coluna, denominador) está declarada em
# `src/semantica/origem-de-kpi.ts`, e as colunas entraram com T-143.
#
# São 21 entradas, e não as 15 que o aceite de T-148 lista. Duas correções:
#
#   · o achado subconta. A medição encontra 23 KPIs constantes, não 15, e o
#     registro de T-145 já os carrega em `constanteNoPrototipo`. Registrado em
#     H-48. Três dos 23 já tinham métrica no Anexo B — tempo de fechamento,
#     ciclo financeiro e inadimplência — então sobram 20 novas;
#   · "mediana salarial" está na lista do aceite e não é KPI: é texto de nota
#     do painel `sal-faixas`. Entra assim mesmo, e a vigésima primeira é ela —
#     nota com número também declara fórmula (PR-3, RF-09).
#
# Todas provisórias, pela mesma regra das 21 do Anexo B.

idade_media:
  rotulo: Idade média
  fonte: vw_fato_rh_mes
  formula: soma(soma_de_idade) / soma(headcount_fte)
  unidade: anos
  agg: ratio
  sentido: neutro
  grao_minimo: [area, mes]
  sinonimos: [idade, idade media, faixa etaria, quantos anos, perfil etario]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Media do quadro no fechamento do recorte,
    e nao do quadro medio do periodo. Sentido neutro: quadro mais velho nao e
    bom nem ruim sozinho.

tempo_medio_de_casa:
  rotulo: Tempo médio de casa
  fonte: vw_fato_rh_mes
  formula: soma(soma_de_tempo_de_casa) / soma(headcount_fte)
  unidade: anos
  agg: ratio
  sentido: maior_melhor
  grao_minimo: [area, mes]
  sinonimos: [tempo de casa, permanencia, senioridade, ha quanto tempo]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Conta so quem esta no quadro. Quem saiu tem
    metrica propria (tempo_ate_a_saida), e misturar as duas daria um numero que
    nao descreve nem o quadro nem a saida.

tempo_ate_a_saida:
  rotulo: Tempo até a saída
  fonte: vw_fato_rh_mes
  formula: soma(soma_de_tempo_ate_a_saida) / soma(desligamentos)
  unidade: anos
  agg: ratio
  sentido: maior_melhor
  grao_minimo: [area, mes]
  sinonimos: [tempo ate a saida, quanto tempo fica, sobrevivencia, quando sai]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). O denominador sao os DESLIGAMENTOS, nao o
    quadro. Trocar os dois daria 0,25 anos -- plausivel e errado.

estados_atendidos:
  rotulo: Estados atendidos
  fonte: vw_fato_rh_perfil
  formula: contagem de UFs com headcount_fte maior que zero no recorte
  unidade: contagem
  agg: last
  sentido: neutro
  grao_minimo: [uf, mes]
  sinonimos: [estados, uf, cobertura geografica, onde tem gente, capilaridade]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Conta estado com QUALQUER pessoa, sem piso.
    A secao 11 exige suprimir grupo com menos de 5 pessoas na EXIBICAO da faixa;
    a contagem de estados nao expoe o grupo, so a existencia dele.

escolaridade_superior:
  rotulo: Superior ou mais
  fonte: vw_fato_rh_perfil
  formula: >-
    soma(headcount_fte em superior, pos-graduacao e mestrado-mais) /
    soma(headcount_fte em todos os niveis)
  unidade: pct
  agg: ratio
  sentido: maior_melhor
  grao_minimo: [area, mes]
  sinonimos: [escolaridade, formacao, superior, graduacao, titulacao]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). INCLUI mestrado, e da 51,6%. O prototipo
    mostra 48,9%, que e Superior mais Pos SEM mestrado -- mestrado e superior ou
    mais. Registrado em H-48.

custo_por_contratacao:
  rotulo: Custo por contratação
  fonte: vw_fato_vagas
  formula: soma(custo_de_recrutamento) / soma(contratados)
  unidade: BRL_mi
  agg: ratio
  sentido: menor_melhor
  grao_minimo: [area, mes]
  sinonimos:
    [custo por contratacao, custo de recrutamento, quanto custa contratar]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Conta so contratacao EFETIVADA, entao vaga
    cancelada joga o custo dela sobre as que fecharam -- que e o comportamento
    correto e nem sempre o esperado.

participacao_treinamento:
  rotulo: Participação em treinamento
  fonte: vw_fato_rh_mes
  formula: participantes_de_treinamento(ultimo mes) / elegiveis(ultimo mes)
  unidade: pct
  agg: ratio
  sentido: maior_melhor
  grao_minimo: [area, mes]
  sinonimos: [participacao, quantos treinam, alcance do treinamento, adesao]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Denominador e o quadro ELEGIVEL, nao o
    quadro inteiro. Na fixture os dois coincidem; a formula nomeia o certo para
    que nada mude quando o dado real distinguir. Lida no ULTIMO MES da janela,
    e nao somada nela: pessoa nao soma ao longo do tempo, e somar dava 108,9%
    de participacao -- mais gente treinando do que gente.

conclusao_treinamento:
  rotulo: Conclusão média
  fonte: vw_fato_treinamento
  formula: soma(trilhas_concluidas) / soma(trilhas_iniciadas)
  unidade: pct
  agg: ratio
  sentido: maior_melhor
  grao_minimo: [area, mes]
  sinonimos: [conclusao, terminou a trilha, evasao, abandono, completou]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Trilha iniciada num mes e concluida no
    seguinte fecha no mes da conclusao. Sob recorte mensal isso pode passar de
    100% -- e a razao de a metrica existir com grao mensal e ser lida em 12m.

custo_por_hora_treinamento:
  rotulo: Custo por hora
  fonte: vw_fato_treinamento
  formula: soma(investimento) / soma(horas)
  unidade: BRL_mi
  agg: ratio
  sentido: menor_melhor
  grao_minimo: [area, mes]
  sinonimos: [custo por hora, quanto custa a hora, preco do treinamento]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Sentido `menor_melhor` trata hora barata
    como melhor, e hora barata costuma ser hora online -- que o proprio dataset
    mostra concluindo 58% contra 86% do presencial.

promotores:
  rotulo: Promotores
  fonte: vw_fato_rh_mes
  formula: soma(promotores) / soma(respondentes)
  unidade: pct
  agg: ratio
  sentido: maior_melhor
  grao_minimo: [area, mes]
  sinonimos: [promotores, quem recomenda, nota 9 ou 10, satisfeitos]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Fracao entre QUEM RESPONDEU, e nao entre o
    quadro. Com 74% de cobertura, os dois numeros diferem em um quarto.

cobertura_da_pesquisa:
  rotulo: Cobertura da pesquisa
  fonte: vw_fato_rh_mes
  formula: soma(respondentes) / soma(elegiveis)
  unidade: pct
  agg: ratio
  sentido: maior_melhor
  grao_minimo: [area, mes]
  sinonimos:
    [cobertura, quantos responderam, adesao a pesquisa, taxa de resposta]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). E o numero que qualifica todos os outros de
    clima: eNPS e engajamento falam pelos 74% que responderam.

encargos_sobre_salarios:
  rotulo: Encargos
  fonte: vw_fato_rh_mes
  formula: soma(encargos) / soma(salarios)
  unidade: pct
  agg: ratio
  sentido: neutro
  grao_minimo: [area, mes]
  sinonimos: [encargos, tributos sobre folha, custo trabalhista, inss e fgts]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Sobre SALARIOS, e nao sobre a folha:
    37,5% contra 22,6%. Os dois sao "percentual de encargos" em portugues, e um
    deles aparece numa negociacao sindical.

mediana_salarial:
  rotulo: Mediana salarial
  fonte: vw_fato_rh_perfil
  formula: >-
    interpolacao linear dentro da faixa salarial que contem a pessoa do meio,
    a partir das contagens por faixa
  unidade: BRL_mi
  agg: ratio
  sentido: neutro
  grao_minimo: [faixa, mes]
  sinonimos: [mediana, mediana salarial, salario do meio, metade ganha menos]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). NAO E KPI: e texto de nota do painel
    sal-faixas, e o aceite de T-148 a lista entre os 15 por engano -- registrado
    em H-48. Entra assim mesmo, porque nota com numero tambem declara formula
    (PR-3, RF-09). A interpolacao sobre faixas da cerca de R$ 6,0 mil contra os
    R$ 6.240 do prototipo; com dado real a mediana sai do salario individual e
    nao da faixa, e a aproximacao some.

margem_bruta:
  rotulo: Margem bruta
  fonte: vw_fato_fin_mes
  formula: (soma(receita_liquida) - soma(cmv)) / soma(receita_liquida)
  unidade: pct
  agg: ratio
  sentido: maior_melhor
  grao_minimo: [entidade, mes]
  sinonimos: [margem bruta, lucro bruto, cmv, custo do produto vendido]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). O que entra no CMV -- frete, perda,
    depreciacao de fabrica -- muda o numero e nao esta definido. Precisa de
    Controladoria em H-08.

margem_liquida:
  rotulo: Margem líquida
  fonte: vw_fato_fin_mes
  formula: >-
    (soma(receita_liquida) - soma(cmv) - soma(despesas_operacionais) -
    soma(depreciacao_e_amortizacao) - soma(resultado_financeiro) -
    soma(nao_operacional)) / soma(receita_liquida)
  unidade: pct
  agg: ratio
  sentido: maior_melhor
  grao_minimo: [entidade, mes]
  sinonimos: [margem liquida, resultado final, bottom line]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Derivada dos degraus da ponte da DRE, e nao
    de uma coluna de lucro. A serie mensal de margem liquida do prototipo nao
    fecha com a ponte -- da -4,3 contra -8 -- e por isso nao foi transcrita.

conversao_de_caixa:
  rotulo: Conversão de caixa
  fonte: vw_fato_fin_mes
  formula: >-
    soma(fco) / (soma(receita_liquida) - soma(cmv) -
    soma(despesas_operacionais))
  unidade: pct
  agg: ratio
  sentido: maior_melhor
  grao_minimo: [entidade, mes]
  sinonimos: [conversao, fco sobre ebitda, virou caixa, qualidade do lucro]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Denominador e o EBITDA calculado, nao uma
    coluna. Em mes de EBITDA proximo de zero a razao explode -- o motivo
    denominador_zero de T-182 existe para esse caso.

pmr:
  rotulo: PMR
  fonte: vw_fato_contas
  formula: soma(a_receber) / soma(vw_fato_fin_mes.receita_liquida) * 365
  unidade: dias
  agg: ratio
  sentido: menor_melhor
  grao_minimo: [entidade, mes]
  sinonimos:
    [
      pmr,
      prazo medio de recebimento,
      prazo de recebimento,
      dias para receber,
      recebemos dos clientes,
      quanto demora a receber,
      dso,
    ]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Usa 365 dias e a receita do periodo. Com
    recorte mensal o prazo fica anualizado sobre um mes so, o que exagera a
    sazonalidade. Precisa de Controladoria em H-08.

pme:
  rotulo: PME
  fonte: vw_fato_fin_mes
  formula: soma(estoque) / soma(cmv) * 365
  unidade: dias
  agg: ratio
  sentido: menor_melhor
  grao_minimo: [entidade, mes]
  sinonimos:
    [
      pme,
      prazo medio de estocagem,
      giro de estoque,
      estoque parado,
      dias de estoque,
      quanto tempo o estoque fica,
      dio,
    ]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). O estoque nao existia no prototipo e foi
    DERIVADO do proprio PME declarado: 75 x 720 / 365 = 148. Quando o dado real
    chegar, o estoque vem da contabilidade e o PME passa a sair dele.

pmp:
  rotulo: PMP
  fonte: vw_fato_contas
  formula: soma(a_pagar) / soma(vw_fato_fin_mes.cmv) * 365
  unidade: dias
  agg: ratio
  sentido: maior_melhor
  grao_minimo: [entidade, mes]
  sinonimos:
    [
      pmp,
      prazo medio de pagamento,
      prazo de pagamento,
      dias para pagar,
      pagamos os fornecedores,
      quanto demora a pagar,
      dpo,
    ]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Sentido `maior_melhor` -- pagar depois
    financia o giro. Denominador deveria ser COMPRAS do periodo, e a fixture nao
    tem essa medida; usa o CMV. Precisa de Controladoria em H-08.

ticket_medio:
  rotulo: Ticket médio
  fonte: vw_fato_fin_mes
  formula: soma(receita_liquida) / soma(notas_emitidas)
  unidade: BRL_mi
  agg: ratio
  sentido: maior_melhor
  grao_minimo: [entidade, mes]
  sinonimos: [ticket medio, valor por nota, pedido medio, quanto cada venda]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Nota fiscal e o denominador, nao pedido nem
    cliente. Uma venda faturada em tres notas conta tres vezes.

concentracao_top_10:
  rotulo: Concentração top 10
  fonte: vw_fato_faturamento_cliente
  formula: soma(receita) / soma(vw_fato_fin_mes.receita_liquida)
  unidade: pct
  agg: ratio
  sentido: menor_melhor
  grao_minimo: [entidade, mes]
  sinonimos: [concentracao, top 10, dependencia de cliente, risco de carteira]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Sentido `menor_melhor`: concentracao e
    risco. Os dez sao fixos e nao os dez do recorte -- sob recorte mensal o
    ranking pode ser outro, e recalcula-lo mudaria o que a metrica mede.

# ===========================================================================
# As métricas que os KPIs de RH pedem, e que não vinham nem do Anexo B nem do
# achado 5 (T-115)
# ===========================================================================
#
# O aceite de T-115 diz que os KPIs das 7 telas de RH são "todos originados do
# catálogo". As 42 posições de KPI dessas telas apontam para 28 métricas
# distintas — muitas repetem, como Turnover 12m, que aparece em `rh/visao` e em
# `rh/turnover`. Das 28, catorze já existiam; estas são as outras catorze.
#
# Todas provisórias, pela mesma regra das anteriores.

custo_por_fte:
  rotulo: Custo por FTE
  fonte: vw_fato_rh_mes
  formula: soma(folha) / soma(headcount_fte do ultimo mes do recorte)
  unidade: BRL_mi
  agg: ratio
  sentido: menor_melhor
  grao_minimo: [area, mes]
  sinonimos: [custo por fte, custo por colaborador, quanto custa cada pessoa]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Denominador e o quadro do FIM do recorte,
    nao o quadro medio. Numa empresa que cresce, o medio da um custo por pessoa
    maior -- e a escolha muda o numero em ano de contratacao forte.

trabalho_flexivel:
  rotulo: Trabalho flexível
  fonte: vw_fato_rh_mes
  formula: soma(headcount_fte em hibrido e remoto) / soma(headcount_fte)
  unidade: pct
  agg: ratio
  sentido: neutro
  grao_minimo: [modalidade, mes]
  sinonimos: [flexivel, hibrido, remoto, home office, presencial]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Conta hibrido COMO flexivel. Uma empresa que
    exige tres dias no escritorio chamaria isso de presencial, e o numero
    mudaria em quinze pontos.

desligamentos:
  rotulo: Desligamentos
  fonte: vw_fato_rh_mes
  formula: soma(desligamentos)
  unidade: contagem
  agg: sum
  sentido: menor_melhor
  grao_minimo: [area, mes]
  sinonimos: [desligamentos, saidas, demissoes, quem saiu, quantos sairam]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Herda a indefinicao de P2 (H-06): se
    transferencia interna contar como desligamento, este numero sobe e o
    turnover sobe junto.

custo_do_turnover:
  rotulo: Custo do turnover
  fonte: vw_fato_rh_mes
  formula: soma(custo_de_reposicao) + soma(custo_de_desligamento)
  unidade: BRL_mi
  agg: sum
  sentido: menor_melhor
  grao_minimo: [area, mes]
  sinonimos:
    [custo do turnover, quanto custa perder gente, custo de rotatividade]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Soma rescisao, ramp-up, produtividade
    perdida e recrutamento de reposicao. A parcela de recrutamento vale R$ 1,9
    mi e o KPI de custo por contratacao vale R$ 0,83 mi no ano -- dois custos de
    recrutamento com o mesmo nome curto e despesas diferentes.

custo_de_reposicao:
  rotulo: Custo de reposição
  fonte: vw_fato_rh_mes
  formula: soma(custo_de_reposicao)
  unidade: BRL_mi
  agg: sum
  sentido: menor_melhor
  grao_minimo: [area, mes]
  sinonimos: [reposicao, ramp-up, curva de aprendizado, produtividade perdida]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). E a parcela do custo do turnover que nao
    aparece em nota fiscal nenhuma: ramp-up e produtividade perdida. Justamente
    por isso e a que gera discussao.

vagas_abertas:
  rotulo: Vagas abertas
  fonte: vw_fato_vagas
  formula: soma(abertas)
  unidade: contagem
  agg: sum
  sentido: neutro
  grao_minimo: [area, mes]
  sinonimos: [vagas abertas, posicoes abertas, quantas vagas, em aberto]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Fluxo e nao estoque: soma as vagas ABERTAS
    no periodo, e nao as que estao abertas hoje. Sob recorte de 12 meses os dois
    numeros diferem bastante.

vagas_em_andamento:
  rotulo: Vagas em andamento
  fonte: vw_fato_vagas
  formula: soma(em_andamento)
  unidade: contagem
  agg: sum
  sentido: neutro
  grao_minimo: [area, mes]
  sinonimos: [em andamento, triagem, entrevistas, processo em curso]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Cobre da triagem a proposta. Vaga com
    proposta feita e nao aceita continua aqui.

vagas_fechadas:
  rotulo: Vagas fechadas
  fonte: vw_fato_vagas
  formula: soma(fechadas)
  unidade: contagem
  agg: sum
  sentido: maior_melhor
  grao_minimo: [area, mes]
  sinonimos: [vagas fechadas, contratacoes, preenchidas, admissoes efetivadas]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Vaga fechada e contratacao efetivada, e o
    numero e igual ao de contratados do funil. Vaga cancelada nao entra.

vagas_canceladas:
  rotulo: Vagas canceladas
  fonte: vw_fato_vagas
  formula: soma(canceladas)
  unidade: contagem
  agg: sum
  sentido: menor_melhor
  grao_minimo: [area, mes]
  sinonimos: [canceladas, vagas canceladas, desistiu da vaga, remanejamento]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Saem do funil sem contratacao, normalmente
    por remanejamento interno. Contam no denominador de "do total movimentado".

investimento_treinamento:
  rotulo: Investimento em treinamento
  fonte: vw_fato_treinamento
  formula: soma(investimento)
  unidade: BRL_mi
  agg: sum
  sentido: maior_melhor
  grao_minimo: [area, mes]
  sinonimos:
    [investimento, verba de treinamento, quanto gasta em desenvolvimento]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Sentido `maior_melhor` trata gastar mais
    como melhor, o que ignora a conclusao -- 21.400 horas com 64% de conclusao.
    Precisa de RH em H-08.

horas_por_fte:
  rotulo: Horas por FTE
  fonte: vw_fato_treinamento
  formula: soma(horas) / soma(vw_fato_rh_mes.headcount_fte do ultimo mes)
  unidade: horas
  agg: ratio
  sentido: maior_melhor
  grao_minimo: [area, mes]
  sinonimos: [horas por fte, horas por pessoa, treinamento per capita]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Divide pelo quadro INTEIRO, e nao so por
    quem treinou: e a leitura de alcance, nao de intensidade. Dividir por quem
    treinou daria outro numero e outra conversa.

engajamento_minimo_por_area:
  rotulo: Área mais crítica
  fonte: vw_fato_rh_mes
  formula: >-
    o menor valor de soma(pontos_de_engajamento) / soma(respondentes)
    entre as areas do recorte
  unidade: pct
  agg: ratio
  sentido: maior_melhor
  grao_minimo: [area, mes]
  sinonimos: [area critica, pior area, menor engajamento, onde esta o problema]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). E um minimo entre areas, e nao uma media:
    sob recorte de uma area so, o minimo e a propria area. A secao 11 exige
    grupo de ao menos 5 pessoas, e area pequena pode virar a "mais critica" por
    ruido amostral -- T-151 trata a supressao.

beneficios:
  rotulo: Benefícios
  fonte: vw_fato_rh_mes
  formula: soma(beneficios)
  unidade: BRL_mi
  agg: sum
  sentido: neutro
  grao_minimo: [area, mes]
  sinonimos: [beneficios, saude, alimentacao, transporte, pacote]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Parcela da folha, e nao despesa a parte.
    Somar a folha com os beneficios contaria os beneficios duas vezes.

remuneracao_variavel:
  rotulo: Variável
  fonte: vw_fato_rh_mes
  formula: soma(variavel)
  unidade: BRL_mi
  agg: sum
  sentido: neutro
  grao_minimo: [area, mes]
  sinonimos: [variavel, bonus, comissao, horas extras, premiacao]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Junta bonus e horas extras, que tem origens
    opostas -- um premia resultado, o outro sinaliza falta de gente. Separa-los
    e uma das perguntas de H-08.

# ===========================================================================
# As métricas que os KPIs de Financeiro e Integração pedem (T-116)
# ===========================================================================
#
# As 6 telas de Financeiro e Integração têm 28 cartões, que apontam para 22
# métricas distintas. Dez já existiam — vieram do Anexo B ou do achado 5 — e
# estas são as outras doze.
#
# Todas provisórias, pela mesma regra das anteriores.

receita_bruta:
  rotulo: Receita bruta
  fonte: vw_fato_fin_mes
  formula: soma(receita_bruta)
  unidade: BRL_mi
  agg: sum
  sentido: maior_melhor
  grao_minimo: [entidade, mes]
  sinonimos: [receita bruta, faturamento bruto, antes das deducoes, top line]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). E a receita ANTES das deducoes. O rodape do
    cartao diz "deducoes de 15%", e a conta e 212 sobre 1.412 -- que da 15,0%.

receita_liquida:
  rotulo: Receita líquida
  fonte: vw_fato_fin_mes
  formula: soma(receita_liquida)
  unidade: BRL_mi
  agg: sum
  sentido: maior_melhor
  grao_minimo: [entidade, mes]
  sinonimos: [receita liquida, faturamento, vendas, receita]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). E o denominador de quase toda margem do
    produto, entao mudar o que entra nela move meia dezena de KPIs juntos.

ebitda:
  rotulo: EBITDA
  fonte: vw_fato_fin_mes
  formula: soma(receita_liquida) - soma(cmv) - soma(despesas_operacionais)
  unidade: BRL_mi
  agg: sum
  sentido: maior_melhor
  grao_minimo: [entidade, mes]
  sinonimos: [ebitda, lajida, resultado antes de juros]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Obtido por diferenca, e nao por soma de
    contas. Nao existe coluna de EBITDA: se existisse, seria possivel ela
    discordar das tres parcelas que a formam.

lucro_liquido:
  rotulo: Lucro líquido
  fonte: vw_fato_fin_mes
  formula: >-
    soma(receita_liquida) - soma(cmv) - soma(despesas_operacionais) -
    soma(depreciacao_e_amortizacao) - soma(resultado_financeiro) -
    soma(nao_operacional)
  unidade: BRL_mi
  agg: sum
  sentido: maior_melhor
  grao_minimo: [entidade, mes]
  sinonimos:
    [lucro liquido, resultado do exercicio, bottom line, deu lucro, demos lucro]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). O ultimo degrau da ponte da DRE, derivado
    dos outros seis. Da -R$ 8 mi no ano: a operacao gera resultado e a
    estrutura de capital o anula.

fco:
  rotulo: Geração operacional
  fonte: vw_fato_fin_mes
  formula: soma(fco)
  unidade: BRL_mi
  agg: sum
  sentido: maior_melhor
  grao_minimo: [entidade, mes]
  sinonimos: [fco, geracao de caixa, caixa operacional, virou dinheiro]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Caixa que a operacao gerou, e nao lucro. A
    diferenca entre os dois e o capital de giro, que e onde o ciclo de 76 dias
    aparece.

capex:
  rotulo: Investimento (FCI)
  fonte: vw_fato_fin_mes
  formula: soma(capex)
  unidade: BRL_mi
  agg: sum
  sentido: neutro
  grao_minimo: [entidade, mes]
  sinonimos: [capex, investimento, fci, imobilizado, manutencao e expansao]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Positivo e SAIDA de caixa. Sentido neutro
    porque investir mais nao e bom nem ruim sozinho -- depende do retorno, que
    esta fora do escopo da v1.

financiamento:
  rotulo: Financiamento (FCF)
  fonte: vw_fato_fin_mes
  formula: soma(financiamento)
  unidade: BRL_mi
  agg: sum
  sentido: neutro
  grao_minimo: [entidade, mes]
  sinonimos: [fcf, financiamento, amortizacao, captacao]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Positivo e SAIDA liquida -- amortizacao e
    juros menos captacao. A fixture nao separa as tres, e separa-las e uma das
    perguntas de H-08.

orcado:
  rotulo: Orçado
  fonte: vw_fato_orcamento
  formula: soma(orcado)
  unidade: BRL_mi
  agg: sum
  sentido: neutro
  grao_minimo: [centro_custo, mes]
  sinonimos: [orcado, orcamento, planejado, budget, previsto]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Orcamento aprovado do periodo. Revisao de
    orcamento no meio do ano nao esta modelada: a fixture tem uma versao so.

realizado:
  rotulo: Realizado
  fonte: vw_fato_orcamento
  formula: soma(realizado)
  unidade: BRL_mi
  agg: sum
  sentido: neutro
  grao_minimo: [centro_custo, mes]
  sinonimos: [realizado, gasto, executado, o que saiu de fato]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). O gasto do periodo pela competencia, e nao
    pelo caixa -- e por isso nao bate com as saidas de caixa.

economia_orcamentaria:
  rotulo: Economia obtida
  fonte: vw_fato_orcamento
  formula: >-
    soma de (orcado - realizado) apenas nos centros de custo onde a diferenca
    e positiva
  unidade: BRL_mi
  agg: sum
  sentido: maior_melhor
  grao_minimo: [centro_custo, mes]
  sinonimos: [economia, sobra de orcamento, gastou menos, abaixo do orcado]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Conta SO os centros que gastaram menos,
    ignorando os que estouraram -- por isso nao e o desvio com sinal trocado.
    Sentido `maior_melhor` trata economizar como bom, e economia por projeto
    nao executado aparece igual. E uma das definicoes que precisam de
    Controladoria em H-08.

ebitda_por_fte:
  rotulo: EBITDA per capita
  fonte: vw_fato_fin_mes, vw_fato_rh_mes
  formula: >-
    (soma(receita_liquida) - soma(cmv) - soma(despesas_operacionais)) /
    headcount_fte(ultimo mes)
  unidade: BRL_mi
  agg: ratio
  sentido: maior_melhor
  grao_minimo: [entidade, mes]
  sinonimos: [ebitda per capita, ebitda por fte, resultado por pessoa]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Cruza duas views, e por isso herda o grao
    da mais grossa: receita nao tem area, entao a razao tambem nao tem. Quebrar
    por area exigiria ratear receita por quadro -- ver H-04 e T-144.

folha_sobre_receita:
  rotulo: Despesa de pessoal
  fonte: vw_fato_rh_mes, vw_fato_fin_mes
  formula: soma(folha) / soma(vw_fato_fin_mes.receita_liquida)
  unidade: pct
  agg: ratio
  sentido: menor_melhor
  grao_minimo: [entidade, mes]
  sinonimos:
    [folha sobre receita, despesa de pessoal, custo de pessoal, peso da folha]
  decisao: >-
    PROVISORIO (D-H03, 2026-08-24). Da 15,5% -- o numero do Anexo C. Sentido
    `menor_melhor` trata folha menor como melhor, o que ignora que cortar gente
    tambem corta receita. E o tipo de leitura que a tela de Integracao existe
    para complicar de proposito.
