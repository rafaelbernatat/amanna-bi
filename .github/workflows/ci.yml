# Pipeline de qualidade (T-006).
#
# Os nomes dos seis jobs — typecheck, lint, teste, build, e2e e contrato — sao
# os mesmos que precisam ser marcados como required status checks na regra da
# branch main (item H-02 de INSTRUCOES.md). Renomear um job aqui sem renomear
# la faz a checagem obrigatoria apontar para um job que nao existe mais, e o
# portao silenciosamente para de reprovar.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Fonte de dado do pipeline. RF-20: a variavel troca o adaptador sem que
  # nenhuma tela mude. O modo warehouse entra em F2, com T-190.
  DATA_SOURCE: fixtures

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # Os resumos de INSTRUCOES.md sao derivados dos itens (T-251 em espirito).
      # Uma auditoria achou oito contagens erradas de uma vez neste arquivo --
      # e ele e lido por pessoas para decidir por onde comecar.
      - run: npm run instrucoes:check

      # Varredura de segredo (T-139).
      #
      # Fica no `lint` de proposito: e uma das cinco checagens exigidas para
      # merge, entao segredo commitado nao entra na main. Num job proprio,
      # seria opcional ate alguem lembrar de exigi-lo.
      #
      # Binario com versao fixa, e nao action: sem licenca para organizacao,
      # sem action de terceiro na cadeia de suprimentos, e o mesmo comando
      # roda local. `--redact` para que o log do CI nunca imprima o valor
      # encontrado — log de CI e publico neste repositorio.
      - name: varredura de segredo
        run: |
          VERSAO=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSAO}/gitleaks_${VERSAO}_linux_x64.tar.gz"             | tar -xz gitleaks
          ./gitleaks dir . --no-banner --redact --exit-code 1 --config .gitleaks.toml

  teste:
    name: teste
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Cache do build do Next
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Versao do Playwright
        id: pw
        run: echo "versao=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
      - name: Cache dos navegadores do Playwright
        id: cache-navegadores
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.versao }}
      - name: Instalar o navegador
        run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Arquivar o relatorio quando falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # A suite de contrato da secao 9.2 (T-123).
  #
  # Job proprio, e nao um passo dentro de `teste`, por duas razoes. A primeira e
  # de leitura: quando ela reprova, o que quebrou nao e "um teste" -- e o
  # contrato entre o cartao e o painel, que e outra conversa e outro dono. A
  # segunda e de tempo: ela percorre 768 recortes e leva ~40 s, e pendurada no
  # `teste` faria a suite de unidade parecer lenta pelo motivo errado.
  #
  # A fonte sai de DATA_SOURCE, e nao de um literal aqui. Repetir "fixtures" no
  # flag criaria duas verdades no mesmo job: trocar a variavel deixaria o job
  # rodando fixtures com nome de warehouse. O RF-21 e justamente que a suite
  # passa identica nas duas fontes -- em F2, so esta variavel muda.
  contrato:
    name: contrato
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Suite de contrato
        run: npm run contrato -- --source=$DATA_SOURCE

      # Arquivado SEMPRE, e nao so no vermelho.
      #
      # O relatorio de uma rodada verde e o que diz quanto ela verificou: 71 de
      # 71 paineis percorridos, 40 de 71 conferidos por alguma regra, e os 31
      # restantes nomeados um a um. E comparando duas rodadas verdes que se
      # descobre que a cobertura encolheu -- um artefato que so existe no
      # vermelho nunca responde "o que deixou de ser olhado".
      - name: Arquivar o relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-de-contrato
          path: relatorios/contrato/
          retention-days: 30
